<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stuwax">
<meta name="theme-color" content="#E9D9CA">
<title>Stuwax</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200..900&display=swap" rel="stylesheet">
<style>
  /* Farben: Creme als Grund, Schwarz für Schrift, Linien und dunkle Flächen,
     Blau als Akzent, Orange für „bereit“. Ecken eckig, Flächen ohne Verlauf. */
  :root {
    --creme: #E9D9CA;
    --schwarz: #111111;
    --blau: #4D6080;
    --orange: #F4721E;
    --text: var(--schwarz);
    --muted: rgba(17, 17, 17, .74);
    --linie: rgba(17, 17, 17, .22);
  }
  * { box-sizing: border-box; }
  html { background: var(--creme); }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--creme);
    color: var(--text);
    font-family: Unbounded, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--creme);
    border-bottom: 1.5px solid var(--schwarz);
    min-height: 88px;
    padding: 0 16px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 18px;
    transition: min-height .3s ease;
  }
  header.klein { min-height: 64px; }
  /* Wortmarke STUWAX: schwarz auf Creme (positiv), Creme auf Schwarz (negativ), das S immer orange */
  .wortmarke { font-weight: 900; letter-spacing: .04em; text-transform: uppercase; line-height: 1; color: var(--schwarz); }
  .wortmarke .s { color: var(--orange); }
  .wortmarke.negativ { color: var(--creme); }
  .logo { margin-right: auto; font-size: 1.1rem; padding-top: 14px; }
  nav { display: flex; flex-wrap: wrap; gap: 4px 18px; }
  nav a {
    padding: 12px 0 9px;
    border-bottom: 3px solid transparent;
    color: var(--muted);
    text-decoration: none;
    font-size: .8rem;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    transition: color .2s ease, border-color .2s ease;
  }
  nav a:hover { color: var(--schwarz); }
  nav a.aktiv { color: var(--schwarz); border-bottom-color: var(--blau); }
  @media (min-width: 768px) {
    header { display: grid; grid-template-columns: 1fr auto 1fr; padding: 0 24px; }
    .logo { margin-right: 0; }
    nav { justify-content: center; }
  }

  main { position: relative; max-width: 760px; margin: 0 auto; padding: 0 16px 48px; }
  main > section { display: none; padding-top: 24px; counter-reset: abschnitt; }
  main > section.aktiv { display: block; }

  h1 {
    margin: 0 0 14px;
    font-size: clamp(1.7rem, 7.5vw, 4rem);
    font-weight: 900;
   
    line-height: .92;
    letter-spacing: -.01em;
    text-transform: uppercase;
    overflow-wrap: anywhere;
    color: var(--schwarz);
  }
  h2 {
    margin: 0 0 12px;
    font-size: .8rem;
    font-weight: 800;
   
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--schwarz);
  }
  /* Abschnitte je Seite nummeriert: 01, 02, 03 */
  h2::before {
    counter-increment: abschnitt;
    content: counter(abschnitt, decimal-leading-zero);
    margin-right: .7em;
    color: var(--blau);
  }
  .beschreibung { margin: 0 0 18px; max-width: 44ch; color: var(--muted); font-size: 1.02rem; line-height: 1.5; }

  /* Schwarze Fläche oben auf der Startseite: Titel und Kennzahlen */
  .hero { margin: 0 0 16px; padding: 24px 18px 20px; background: var(--schwarz); color: var(--creme); }
  .hero h1 { color: var(--creme); }
  .hero .beschreibung { margin-bottom: 20px; color: rgba(233, 217, 202, .86); }
  .hero .kpi-zeile { margin-bottom: 0; }

  /* Kennzahlen: blaue Linie oben, grosse Zahl, kleiner Text */
  .kpi-zeile { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin: 0 0 18px; }
  .kpi { min-width: 0; padding-top: 10px; border-top: 3px solid var(--blau); }
  .kpi-zahl { font-size: 2.2rem; font-weight: 900; line-height: 1; overflow-wrap: anywhere; }
  .kpi-text { margin-top: 8px; font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .hero .kpi-zahl { color: var(--creme); }
  .hero .kpi-text { color: rgba(233, 217, 202, .86); }

  .panel {
    margin-bottom: 16px;
    padding: 18px;
    background: var(--creme);
    border: 1.5px solid var(--schwarz);
    border-radius: 0;
    animation: einblenden .4s ease-out both;
  }
  @keyframes einblenden {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: none; }
  }

  .lbl { display: block; margin: 14px 0 6px; font-size: .74rem; font-weight: 700; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  .feld {
    width: 100%;
    padding: 11px 12px;
    border: 1.5px solid var(--schwarz);
    border-radius: 0;
    background: var(--creme);
    color: var(--schwarz);
    font: inherit;
    font-size: 1rem;
  }
  .feld:focus { outline: 3px solid var(--blau); outline-offset: 1px; }
  /* Datumsfeld: auf dem iPhone sonst breiter als die anderen Felder */
  input[type="date"].feld { -webkit-appearance: none; appearance: none; display: block; min-width: 0; max-width: 100%; text-align: left; }
  .zeile { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .zeile > * { flex: 1 1 auto; }

  .knopf, .knopf-sekundaer {
    padding: 13px 18px;
    border: 1.5px solid var(--schwarz);
    border-radius: 0;
    font: inherit;
    font-size: .95rem;
    font-weight: 700;
    text-align: center;
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease, background-color .2s ease;
  }
  /* Primärknopf: Blau mit Creme-Schrift. Beim Drüberfahren ein harter Schatten statt Glühen */
  .knopf { background: var(--blau); border-color: var(--blau); color: var(--creme); }
  .knopf:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: 3px 3px 0 var(--schwarz); }
  .knopf-sekundaer { background: transparent; color: var(--schwarz); }
  .knopf-sekundaer:hover:not(:disabled) { background: rgba(17, 17, 17, .08); }
  .knopf:disabled, .knopf-sekundaer:disabled { opacity: .4; cursor: default; }
  /* Ski ready: Orange mit schwarzer Schrift */
  .bereit-knopf { background: var(--orange); border-color: var(--schwarz); color: var(--schwarz); }
  .knopf-paar > * { flex: 1 1 0; }
  @media (max-width: 600px) {
    .knopf-paar { flex-direction: column; }
  }

  .bestaetigt { margin-top: 8px; min-height: 1.2em; color: var(--blau); font-weight: 700; }
  .checkgruppe { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 6px; }
  .check { display: inline-flex; align-items: center; gap: 8px; font-size: .95rem; color: var(--schwarz); }
  input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--blau); }
  .wachsliste label { display: flex; align-items: center; gap: 10px; padding: 9px 0; font-size: .95rem; border-bottom: 1px solid var(--linie); }
  .wachsliste label:last-child { border-bottom: 0; }

  .hinweis { margin-top: 6px; min-height: 1.2em; font-size: .85rem; line-height: 1.5; color: var(--muted); }
  .ergebnis { margin-top: 18px; padding-top: 14px; border-top: 1.5px solid var(--schwarz); }
  .wachs-name { margin-top: 4px; font-size: 1.15rem; font-weight: 800; }

  /* Ski: eckige Karte. Kante ready blau, Ski ready orange, jeweils dick umrandet */
  .ski {
    margin-bottom: 14px;
    padding: 16px;
    background: var(--creme);
    border: 1.5px solid var(--schwarz);
    border-radius: 0;
  }
  .ski.kante:not(.bereit) { border: 3px solid var(--blau); padding: 14.5px; }
  .ski.bereit { border: 3px solid var(--orange); padding: 14.5px; }
  .ski.aktiv { outline: 2px solid var(--schwarz); outline-offset: 3px; }
  .ski-kopf { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; cursor: pointer; }
  .ski-name { font-size: 1.02rem; font-weight: 800; letter-spacing: .01em; }
  .ski-name strong { color: var(--blau); font-size: 1.15rem; }
  .ski-datum { font-size: .85rem; font-weight: 400; color: var(--muted); }
  .ski-meta { font-size: .8rem; color: var(--muted); }
  .ski-bereit {
    display: inline-block;
    margin-right: 4px;
    padding: 2px 7px;
    border: 1.5px solid var(--schwarz);
    border-radius: 0;
    background: var(--orange);
    color: var(--schwarz);
    font-size: .68rem;
    font-weight: 800;
    letter-spacing: .08em;
    vertical-align: middle;
  }
  .ski-aktionen { display: flex; gap: 6px; margin-left: auto; }
  .ski-aktionen .icon-knopf { width: 34px; height: 34px; flex: 0 0 34px; }
  .ski-aktionen .icon-knopf:disabled { opacity: .35; cursor: default; }

  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .baseline { stroke: var(--schwarz); stroke-width: 2; }
  .tick { stroke: var(--schwarz); stroke-width: 1; }
  .axis-label { fill: var(--schwarz); font-size: 17px; font-weight: 600; }
  .dot { cursor: pointer; stroke: var(--schwarz); stroke-width: 1.5; }
  .dot:hover, .dot:focus, .dot.aktiv-punkt { stroke-width: 3; outline: none; }
  .legende { display: flex; flex-wrap: wrap; gap: 14px; margin: 8px 0 22px; font-size: .8rem; color: var(--schwarz); }
  .detail {
    min-height: 3.2em;
    margin-top: 14px;
    padding: 14px 16px;
    background: var(--creme);
    border: 1.5px solid var(--schwarz);
    border-radius: 0;
    font-size: .92rem;
  }
  .detail:empty { display: none; }
  .detail .k { color: var(--muted); }
  .leer { font-style: italic; color: var(--muted); }
  .eintrag-zeile { padding: 12px 0; border-top: 1px solid var(--linie); -webkit-touch-callout: none; }
  .eintrag-zeile:first-child { padding-top: 0; border-top: 0; }
  .eintrag-kopf { font-size: .95rem; font-weight: 800; }
  .eintrag-kopf, .eintrag-zeile > .hinweis { user-select: none; -webkit-user-select: none; }

  .fenster-hintergrund {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(17, 17, 17, .6);
    overflow-y: auto;
  }
  .fenster {
    width: 100%;
    max-width: 680px;
    padding: 18px;
    background: var(--creme);
    border: 1.5px solid var(--schwarz);
    border-radius: 0;
  }
  .fenster-kopf { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
  .fenster-aktionen { display: flex; flex: none; gap: 8px; align-items: flex-start; }
  .eintrag-kopf-zeile { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
  .fenster-datum { width: auto; margin-top: 8px; padding: 8px 10px; }
  .fenster-kreuz {
    flex: none;
    width: 42px;
    height: 42px;
    border: 1.5px solid var(--schwarz);
    border-radius: 0;
    background: transparent;
    color: var(--schwarz);
    font-size: 1.6rem;
    line-height: 1;
    cursor: pointer;
  }
  .fenster-kreuz:hover { background: rgba(17, 17, 17, .08); }
  .icon-knopf {
    flex: 0 0 40px;
    width: 40px;
    height: 40px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 1.5px solid var(--schwarz);
    border-radius: 0;
    background: transparent;
    color: var(--schwarz);
    cursor: pointer;
  }
  .icon-knopf:hover { background: rgba(17, 17, 17, .08); }
  .zeile > .icon-knopf { flex: 0 0 40px; }
  .fenster-zeitstrahl { margin: 8px 0 14px; }
  .fenster .zeile > * { flex: 1 1 0; }
  .fenster .zeile > .icon-knopf { flex: 0 0 40px; width: 40px; }
  .trenner { margin: 16px 0; border: 0; border-top: 1.5px solid var(--schwarz); }

  /* Fusszeile: schwarzes Band mit echten Angaben zur App */
  footer.kontakt { padding: 30px 16px 36px; background: var(--schwarz); color: var(--creme); }
  footer.kontakt .innen { max-width: 760px; margin: 0 auto; }
  footer.kontakt .wortmarke { font-size: 1.4rem; }

  @media (prefers-reduced-motion: reduce) {
    .panel { animation: none; }
    header, .knopf, .knopf-sekundaer { transition: none; }
    .knopf:hover:not(:disabled) { transform: none; }
  }
</style>
</head>
<body>

<header>
  <div class="logo wortmarke"><span class="s">S</span>TUWAX</div>
  <nav>
    <a href="#/" data-route="home">Wachsrechner</a>
    <a href="#/slalom" data-route="slalom">Slalom</a>
    <a href="#/riesenslalom" data-route="riesenslalom">Riesenslalom</a>
    <a href="#/super-g" data-route="super-g">Super-G</a>
    <a href="#/abfahrt" data-route="abfahrt">Abfahrt</a>
  </nav>
</header>

<main>
  <section id="home"></section>
  <section id="slalom"></section>
  <section id="riesenslalom"></section>
  <section id="super-g"></section>
  <section id="abfahrt"></section>
</main>

<footer class="kontakt">
  <div class="innen">
    <div class="wortmarke negativ"><span class="s">S</span>TUWAX</div>
  </div>
</footer>

<script>
'use strict';

// ============================================================
// 1. Konstanten und Beispieldaten
// ============================================================

const STORAGE_KEY = 'stuwax-v1';
const TAG = 86400000;
const SVG_NS = 'http://www.w3.org/2000/svg';
const W = 600, H = 60, PAD = 24, BASE_Y = 30;
const MONATE = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];
// Farbe der Punkte im Zeitstrahl je Art: Wachsen schwarz, Kanten blau, Skifahren orange
function symbolFarbe(art) {
  if (art === 'kanten') return '#4D6080';
  if (art === 'skifahren') return '#F4721E';
  return '#111111';
}

const DISZIPLINEN = [
  { key: 'slalom', titel: 'Slalom' },
  { key: 'riesenslalom', titel: 'Riesenslalom' },
  { key: 'super-g', titel: 'Super-G' },
  { key: 'abfahrt', titel: 'Abfahrt' }
];

const ARTEN = { wachsen: 'Wachsen', kanten: 'Kanten', skifahren: 'Skifahren' };

const KANTEN_OPTIONEN = { diamant: 'Nur mit Diamant', diamant_feile: 'Diamant und Feile' };

const FAHRTARTEN = [
  { id: 'piste', name: 'Piste' },
  { id: 'tiefschnee', name: 'Tiefschnee' },
  { id: 'training', name: 'Training' },
  { id: 'rennen', name: 'Rennen' },
  { id: 'tour', name: 'Tour' }
];

// Vola: je Typ (Flüssig, Hart) drei Linien (LM, HM, Moly) in vier Farben, also 24 Wachse
const VOLA_FAMILIEN_NAMEN = { LM: 'LM Race', HM: 'HM Race', LMMOLY: 'LM Race MOLY', HMMOLY: 'HM Race MOLY' };
const VOLA_ZONE_NAMEN = { blau: 'Blau', violett: 'Violett', rot: 'Rot', gelb: 'Gelb' };
// Vola-Basewachse (Beta-Wachse)
const VOLA_BASE_HART = ['Base Hard', 'Base Medium', 'Base Medium Race', 'Base Soft', 'Base Soft Race',
  'Premium MX901', 'Graphite', 'Graphite LM', 'VRB', 'X-Hard'];
const VOLA_BASE_FLUESSIG = ['MX-E Gelb', 'MX-E Rot', 'MX-E Violett', 'MX-E Blau'];

function baueVolaWachse() {
  const liste = [];
  let n = 1;
  for (const typ of ['fluessig', 'hart']) {
    for (const linie of ['LM', 'HM', 'LMMOLY', 'HMMOLY']) {
      for (const farbe of Object.keys(VOLA_ZONE_NAMEN)) {
        liste.push({ id: 'w' + n++, marke: 'Vola', name: `${VOLA_FAMILIEN_NAMEN[linie]} ${VOLA_ZONE_NAMEN[farbe]}`, typ, aktiv: true, kategorie: 'rennwachs' });
      }
    }
  }
  for (const name of VOLA_BASE_HART) {
    liste.push({ id: 'w' + n++, marke: 'Vola', name, typ: 'hart', aktiv: true, kategorie: 'basewachs' });
  }
  for (const name of VOLA_BASE_FLUESSIG) {
    liste.push({ id: 'w' + n++, marke: 'Vola', name, typ: 'fluessig', aktiv: true, kategorie: 'basewachs' });
  }
  return liste;
}

// Pistenverhältnisse und Lauf für Skifahren-Einträge (mehrere möglich)
const PISTENVERHAELTNISSE = [
  { id: 'eis', name: 'Eis' },
  { id: 'kompakt', name: 'Kompakt' },
  { id: 'kugellager', name: 'Kugellager' },
  { id: 'kunstschnee', name: 'Kunstschnee' },
  { id: 'aggressiv', name: 'Aggressiv' },
  { id: 'neuschnee', name: 'Neuschnee' },
  { id: 'sulz', name: 'Sulz' }
];
const LAUFARTEN = [
  { id: 'drehend', name: 'Drehend' },
  { id: 'direkt', name: 'Direkt' },
  { id: 'wenig-platz', name: 'Wenig Platz' },
  { id: 'viel-platz', name: 'Viel Platz' }
];

// Startzustand: keine Ski und keine Einträge, die Vola-Wachsliste ist vorbelegt.
const DEMO = {
  skis: [],
  wachse: baueVolaWachse(),
  eintraege: []
};

// ============================================================
// 2. Hilfsfunktionen
// ============================================================

function kopie(obj) {
  return JSON.parse(JSON.stringify(obj));
}

// Baut ein DOM-Element. Attribute, die mit "on" beginnen, werden als Ereignis registriert.
function h(tag, attrs, ...kinder) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v === true ? '' : String(v));
  }
  for (const kind of kinder.flat()) {
    if (kind === null || kind === undefined || kind === false) continue;
    node.append(kind instanceof Node ? kind : document.createTextNode(String(kind)));
  }
  return node;
}

function svgEl(name, attrs, parent) {
  const node = document.createElementNS(SVG_NS, name);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (parent) parent.appendChild(node);
  return node;
}

function heuteISO() {
  const t = new Date();
  const monat = String(t.getMonth() + 1).padStart(2, '0');
  const tag = String(t.getDate()).padStart(2, '0');
  return `${t.getFullYear()}-${monat}-${tag}`;
}

function zeitpunkt(datum) {
  return new Date(datum + 'T12:00:00').getTime();
}

function datumDE(iso) {
  return new Date(iso + 'T12:00:00').toLocaleDateString('de-CH', { day: 'numeric', month: 'short', year: 'numeric' });
}

function neueId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

// Vola Race: welches Produkt zu Schneeart und Farbe passt (nach der Vola-Tabelle).
const VOLA_FARBEN ={ blau: '#1f5fa8', violett: '#7b2a7d', rot: '#d62a2a', gelb: '#f5d400' };
const VOLA_TABELLE = {
  neu: { blau: ['LM', 'HM'], violett: ['LM', 'HM'], rot: ['LM'], gelb: ['LM'] },
  alt: { blau: ['HM'], violett: ['LM', 'HM'], rot: ['LM', 'HM'], gelb: ['LM', 'HM'] },
  kunst: { blau: ['LMMOLY', 'HMMOLY'], violett: ['LMMOLY', 'HMMOLY'], rot: ['LMMOLY', 'HMMOLY'], gelb: ['LMMOLY', 'HMMOLY'] }
};
const SCHNEEART_SCHLUESSEL = { Neuschnee: 'neu', Altschnee: 'alt', Firn: 'alt', Kunstschnee: 'kunst' };

// Farbe nach Lufttemperatur. Die Bereiche der Tabelle überlappen,
// hier gilt: bis -10 blau, bis -4 violett, bis 0 rot, darüber gelb.
function volaZone(t) {
  if (t <= -10) return 'blau';
  if (t <= -4) return 'violett';
  if (t <= 0) return 'rot';
  return 'gelb';
}

// ============================================================
// 3. Speicherung
// ============================================================

function ladeState() {
  try {
    const roh = localStorage.getItem(STORAGE_KEY);
    if (roh) {
      const daten = JSON.parse(roh);
      // Gespeicherte Fremdmarken durch die Wöhler-Wachse ersetzen
      if (Array.isArray(daten.wachse)) {
        // Wachsliste immer aus der Vorgabe aufbauen, gespeichert bleiben nur die Häkchen (aktiv)
        daten.wachse = DEMO.wachse.map(d => {
          const alt = daten.wachse.find(w => w.name === d.name && w.typ === d.typ && w.kategorie === d.kategorie)
            || daten.wachse.find(w => w.name === d.name);
          return { ...d, aktiv: alt ? alt.aktiv : d.aktiv };
        });
      }
      return daten;
    }
  } catch (err) {
    console.warn('Gespeicherte Daten konnten nicht gelesen werden', err);
  }
  return kopie(DEMO);
}

function speichern() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.warn('Speichern im Browser nicht möglich', err);
  }
}

let state = ladeState();

// ============================================================
// 4. Zugriffe auf den Zustand
// ============================================================

// Gewählter Ski einer Disziplin. Fällt auf den ersten Ski zurück.
function aktiverSki(key) {
  const liste = skisDerDisziplin(key);
  let ski = liste.find(s => s.id === aktuellerSki[key]);
  if (!ski) ski = liste[0];
  aktuellerSki[key] = ski ? ski.id : null;
  return ski || null;
}

// Zahl aus einem Eingabefeld, leer ergibt null
function zahlOderNull(feld) {
  const t = feld.value.trim();
  return t === '' ? null : Number(t);
}

// Mittelwert aus Start und Ziel. Ist nur ein Wert da, gilt dieser allein.
function mittelWert(start, ziel) {
  const werte = [start, ziel].filter(x => x !== null && !Number.isNaN(x));
  return werte.length ? werte.reduce((s, x) => s + x, 0) / werte.length : null;
}

function wachsrechnerStart() {
  const startLuft = zahlOderNull(homeUI.luft);
  const zielLuft = zahlOderNull(homeUI.luftZiel);
  const luft = mittelWert(startLuft, zielLuft);
  const startSchnee = zahlOderNull(homeUI.schnee);
  const zielSchnee = zahlOderNull(homeUI.schneeZiel);
  const tSchnee = mittelWert(startSchnee, zielSchnee);
  const schneeart = homeUI.schneeart.value || homeUI.schneeartZiel.value;

  homeUI.ergebnis.innerHTML = '';
  if (luft === null) {
    homeUI.ergebnis.append(h('div', { class: 'hinweis' }, 'Bitte mindestens eine Lufttemperatur eingeben.'));
    return;
  }
  if (!schneeart) {
    homeUI.ergebnis.append(h('div', { class: 'hinweis' }, 'Bitte mindestens eine Schneeart wählen.'));
    return;
  }

  const zone = volaZone(luft);
  const linien = VOLA_TABELLE[SCHNEEART_SCHLUESSEL[schneeart]][zone];
  const namen = linien.map(l => `${VOLA_FAMILIEN_NAMEN[l]} ${VOLA_ZONE_NAMEN[zone]}`);
  // Nur aktivierte Wachse aus der Liste
  // Jedes Produkt nur einmal, mit den Typen, die aktiviert sind
  const gefunden = [...new Set(namen)]
    .map(n => ({ name: n, typen: [...new Set(aktiveWachse().filter(x => x.name === n).map(x => (x.typ === 'hart' ? 'Hart' : 'Flüssig')))] }))
    .filter(g => g.typen.length > 0);

  const beide = startLuft !== null && zielLuft !== null;
  const luftText = beide
    ? `Luft ${luft.toFixed(1)} °C (Mittel aus Start ${startLuft} und Ziel ${zielLuft})`
    : `Luft ${luft} °C`;
  const schneeBeide = startSchnee !== null && zielSchnee !== null;
  const schneeText = tSchnee === null ? ''
    : schneeBeide
      ? `, Schnee ${tSchnee.toFixed(1)} °C (Mittel aus Start ${startSchnee} und Ziel ${zielSchnee})`
      : `, Schnee ${tSchnee} °C`;

  homeUI.ergebnis.append(
    h('div', { class: 'wachs-name' },
      h('span', { style: `display:inline-block;width:14px;height:14px;border-radius:50%;background:${VOLA_FARBEN[zone]};margin-right:6px;vertical-align:middle` }),
      gefunden.length ? 'Vola Race' : 'Kein aktives Wachs für diese Bedingungen'),
    ...gefunden.map(g => h('div', { class: 'hinweis' }, `${g.name} (${g.typen.join(', ')})`)),
  );
}

// Setzt alle Wachse einer Gruppe (Flüssig oder Hart) auf aktiv oder inaktiv.
function setzeGruppe(typ, kategorie, an) {
  for (const w of state.wachse) {
    if (w.typ === typ && w.kategorie === kategorie) w.aktiv = an;
  }
  speichern();
  baueWachsListe();
  aktualisiereWachsformulare();
}

  homeUI.wachsListe.innerHTML = '';

// Name mit Nummer und Steinski-Hinweis

// Langes Drücken (ca. 0,5 s) auf einen Eintrag öffnet das Eintrag-Fenster.
// Ein kurzes Antippen oder Scrollen löst nichts aus.
function langDruecken(element, aktion) {
  let timer = null;
  const stoppe = () => {
    if (timer) {
      clearTimeout(timer);
      timer = null;
    }
  };
  element.addEventListener('pointerdown', ev => {
    if (ev.target.closest('button, input, select, label')) return;
    stoppe();
    timer = setTimeout(() => {
      timer = null;
      aktion();
    }, 500);
  });
  element.addEventListener('pointerup', stoppe);
  element.addEventListener('pointerleave', stoppe);
  element.addEventListener('pointercancel', stoppe);
  element.addEventListener('pointermove', ev => {
    if (ev.pointerType === 'touch') stoppe();
  });
  element.addEventListener('contextmenu', ev => ev.preventDefault());
}

// Zeitstrahl eines einzelnen Skis im Fenster. Der aktuelle Eintrag ist hervorgehoben,
// ein Klick auf einen Punkt springt zu diesem Eintrag.
function zeichneEintragZeitstrahl(box, ski, alle, hervorTag, aufWahl) {
  box.textContent = '';
  const zeiten = alle.map(e => zeitpunkt(e.datum));
  const min = Math.min(...zeiten) - 7 * TAG;
  const max = Math.max(...zeiten) + 7 * TAG;
  const x = t => PAD + ((t - min) / (max - min)) * (W - 2 * PAD);

  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Zeitstrahl ' + ski.name });
  svgEl('line', { x1: PAD, x2: W - PAD, y1: BASE_Y, y2: BASE_Y, class: 'baseline' }, svg);

  const m = new Date(min);
  m.setDate(1);
  m.setHours(12, 0, 0, 0);
  if (m.getTime() < min) m.setMonth(m.getMonth() + 1);
  while (m.getTime() <= max) {
    const tx = x(m.getTime());
    svgEl('line', { x1: tx, x2: tx, y1: BASE_Y, y2: BASE_Y + 5, class: 'tick' }, svg);
    const beschriftung = svgEl('text', { x: tx, y: BASE_Y + 18, 'text-anchor': 'middle', class: 'axis-label' }, svg);
    beschriftung.textContent = MONATE[m.getMonth()];
    m.setMonth(m.getMonth() + 1);
  }

  // Einträge am selben Tag stehen übereinander. Der Tag des Fensters ist hervorgehoben.
  const gezaehlt = {};
  for (const e of alle) {
    const cx = x(zeitpunkt(e.datum));
    gezaehlt[e.datum] = (gezaehlt[e.datum] || 0) + 1;
    const cy = BASE_Y - 8 - (gezaehlt[e.datum] - 1) * 14;
    let punkt;
    if (e.art === 'kanten') {
      punkt = svgEl('rect', { x: cx - 6, y: cy - 6, width: 12, height: 12 }, svg);
    } else if (e.art === 'skifahren') {
      punkt = svgEl('path', { d: `M${cx} ${cy - 8} L${cx + 8} ${cy + 6} L${cx - 8} ${cy + 6} Z` }, svg);
    } else {
      punkt = svgEl('circle', { cx: cx, cy: cy, r: 7 }, svg);
    }
    punkt.setAttribute('class', 'dot' + (e.datum === hervorTag ? ' aktiv-punkt' : ''));
    punkt.setAttribute('fill', symbolFarbe(e.art));
    punkt.setAttribute('tabindex', '0');
    punkt.addEventListener('click', () => aufWahl(e));
  }
  box.append(svg);
}

// Fenster für einen Eintrag: Zeitstrahl des Skis, Details und Zurück/Vor
function zeigeEintragFenster(key, ski, startEintrag) {
  const alleEintraege = () => state.eintraege
    .filter(x => x.ski === ski.id)
    .sort((a, b) => a.datum.localeCompare(b.datum));
  const tage = () => [...new Set(alleEintraege().map(x => x.datum))];
  if (!alleEintraege().some(x => x.id === startEintrag.id)) return;
  let aktuellerTag = startEintrag.datum;
  let bearbeitenId = null;
  let hinweisText = '';

  const hintergrund = h('div', { class: 'fenster-hintergrund' });
  const karte = h('div', { class: 'fenster' });
  hintergrund.append(karte);
  document.body.append(hintergrund);

  const schliessen = () => {
    hintergrund.remove();
    document.removeEventListener('keydown', taste);
  };
  // Zurück und Vor springen von Tag zu Tag, alle Einträge eines Tages bleiben zusammen
  const wechsel = d => {
    const liste = tage();
    const neu = liste.indexOf(aktuellerTag) + d;
    if (neu < 0 || neu >= liste.length) return;
    aktuellerTag = liste[neu];
    bearbeitenId = null;
    hinweisText = '';
    zeichne();
  };
  // Kalender: springt zum gewählten Tag. Hat er keine Einträge, kommt der nächste davor oder danach.
  const springeZu = iso => {
    if (!iso) return;
    const liste = tage();
    let ziel = liste.includes(iso) ? iso : null;
    hinweisText = '';
    if (!ziel) {
      ziel = liste.filter(d => d < iso).pop() || liste.find(d => d > iso) || null;
      if (ziel) hinweisText = `Kein Eintrag am ${datumDE(iso)}.`;
    }
    if (!ziel) return;
    aktuellerTag = ziel;
    bearbeitenId = null;
    zeichne();
  };
  const taste = ev => {
    if (ev.key === 'Escape') schliessen();
    if (bearbeitenId === null && ev.key === 'ArrowLeft') wechsel(-1);
    if (bearbeitenId === null && ev.key === 'ArrowRight') wechsel(1);
  };
  document.addEventListener('keydown', taste);
  hintergrund.addEventListener('click', ev => {
    if (ev.target === hintergrund) schliessen();
  });

  const zeichne = () => {
    const liste = tage();
    if (!liste.length) {
      schliessen();
      return;
    }
    if (!liste.includes(aktuellerTag)) {
      // Der Tag ist leer geworden: nächsten Tag danach nehmen, sonst den letzten
      aktuellerTag = liste.find(d => d > aktuellerTag) || liste[liste.length - 1];
    }
    const idx = liste.indexOf(aktuellerTag);
    const eintraegeTag = alleEintraege().filter(x => x.datum === aktuellerTag);
    karte.textContent = '';

    const zeitstrahlBox = h('div', { class: 'fenster-zeitstrahl' });
    const eintragsBox = h('div', {});
    karte.append(
      h('div', { class: 'fenster-kopf' },
        h('div', {},
          h('div', { class: 'eintrag-kopf' }, skiBeschriftung(ski)),
          h('input', { class: 'feld fenster-datum', type: 'date', value: aktuellerTag, 'aria-label': 'Tag auswählen',
            onchange: ev => springeZu(ev.target.value) }),
          ...(hinweisText ? [h('div', { class: 'hinweis' }, hinweisText)] : [])),
        h('button', { class: 'fenster-kreuz', type: 'button', onclick: schliessen,
          'aria-label': 'Zurück zu allen Einträgen', title: 'Zurück zu allen Einträgen' }, '×')),
      zeitstrahlBox,
      eintragsBox,
      ...(bearbeitenId === null ? [h('div', { class: 'zeile' },
        h('button', { class: 'knopf-sekundaer', type: 'button', disabled: idx === 0, onclick: () => wechsel(-1) }, '◀ Zurück'),
        h('button', { class: 'knopf-sekundaer', type: 'button', disabled: idx === liste.length - 1, onclick: () => wechsel(1) }, 'Vor ▶'))] : []));

    // Alle Einträge dieses Tages untereinander, jeder mit eigenen Icons
    for (const e of eintraegeTag) {
      const eintragKarte = h('div', { class: 'panel' });
      eintragsBox.append(eintragKarte);
      if (bearbeitenId === e.id) {
        bearbeiteEintrag(key, ski, e, eintragKarte, () => {
          aktualisiere(key);
          bearbeitenId = null;
          zeichne();
        });
        continue;
      }
      eintragKarte.append(
        h('div', { class: 'eintrag-kopf-zeile' },
          h('div', { class: 'eintrag-kopf' }, ARTEN[e.art]),
          h('div', { class: 'fenster-aktionen' },
            h('button', { class: 'icon-knopf', type: 'button', title: 'Eintrag bearbeiten', 'aria-label': 'Eintrag bearbeiten',
              onclick: () => {
                bearbeitenId = e.id;
                zeichne();
              } }, stiftIcon()),
            h('button', { class: 'icon-knopf', type: 'button', title: 'Eintrag löschen', 'aria-label': 'Eintrag löschen',
              onclick: () => bestaetigeInline(eintragKarte, 'Diesen Eintrag löschen?', () => {
                state.eintraege = state.eintraege.filter(x => x.id !== e.id);
                speichern();
                aktualisiere(key);
                bearbeitenId = null;
                zeichne();
              }) }, muellIcon()))),
        h('div', { class: 'zeile' }, eintragKurz(e)),
        ...(e.notiz ? [h('div', { class: 'hinweis' }, e.notiz)] : []));
    }

    zeichneEintragZeitstrahl(zeitstrahlBox, ski, alleEintraege(), aktuellerTag, eintrag => {
      aktuellerTag = eintrag.datum;
      bearbeitenId = null;
      hinweisText = '';
      zeichne();
    });
  };
  zeichne();
}

// Liniensymbole (1,5 px Strich), für Bearbeiten und Löschen
function liniensymbol(pfade) {
  const svg = document.createElementNS(SVG_NS, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('width', '16');
  svg.setAttribute('height', '16');
  svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', 'currentColor');
  svg.setAttribute('stroke-width', '1.5');
  svg.setAttribute('stroke-linecap', 'round');
  svg.setAttribute('stroke-linejoin', 'round');
  svg.setAttribute('aria-hidden', 'true');
  for (const d of pfade) {
    const pfad = document.createElementNS(SVG_NS, 'path');
    pfad.setAttribute('d', d);
    svg.append(pfad);
  }
  return svg;
}
function stiftIcon() {
  return liniensymbol(['M4 20h4L19 9l-4-4L4 16v4z', 'M13.5 6.5l4 4']);
}
function muellIcon() {
  return liniensymbol(['M4 7h16', 'M9 7V5h6v2', 'M6 7l1 13h10l1-13', 'M10 11v6', 'M14 11v6']);
}

// Einträge eines Skis zum Bearbeiten oder Löschen, als Fenster über der Seite
function zeigeSkiEintraege(key, ski, modus) {
  const hintergrund = h('div', { class: 'fenster-hintergrund' });
  const karte = h('div', { class: 'fenster' });
  hintergrund.append(karte);
  document.body.append(hintergrund);

  const schliessen = () => {
    hintergrund.remove();
    document.removeEventListener('keydown', taste);
  };
  const taste = ev => {
    if (ev.key === 'Escape') schliessen();
  };
  document.addEventListener('keydown', taste);
  hintergrund.addEventListener('click', ev => {
    if (ev.target === hintergrund) schliessen();
  });

  const zeichne = () => {
    karte.textContent = '';
    const eintraege = state.eintraege
      .filter(x => x.ski === ski.id)
      .sort((a, b) => b.datum.localeCompare(a.datum));
    karte.append(
      h('div', { class: 'fenster-kopf' },
        h('div', {},
          h('div', { class: 'eintrag-kopf' }, skiBeschriftung(ski)),
          h('div', { class: 'hinweis' }, modus === 'bearbeiten' ? 'Eintrag bearbeiten' : 'Eintrag löschen')),
        h('button', { class: 'fenster-kreuz', type: 'button', onclick: schliessen, 'aria-label': 'Schliessen', title: 'Schliessen' }, '×')));
    if (!eintraege.length) {
      karte.append(h('div', { class: 'leer' }, 'Keine Einträge für diesen Ski.'));
      return;
    }
    for (const e of eintraege) {
      const zeile = h('div', { class: 'eintrag-zeile' },
        h('div', { class: 'eintrag-kopf' }, `${datumDE(e.datum)} · ${ARTEN[e.art]}`),
        h('div', { class: 'hinweis' }, eintragKurz(e)),
        h('div', { class: 'zeile' },
          modus === 'bearbeiten'
            ? h('button', {
                class: 'icon-knopf', type: 'button', title: 'Eintrag bearbeiten', 'aria-label': 'Eintrag bearbeiten',
                onclick: () => bearbeiteEintrag(key, ski, e, zeile, () => {
                  aktualisiere(key);
                  zeichne();
                })
              }, stiftIcon())
            : h('button', {
                class: 'icon-knopf', type: 'button', title: 'Eintrag löschen', 'aria-label': 'Eintrag löschen',
                onclick: () => bestaetigeInline(zeile, 'Diesen Eintrag löschen?', () => {
                  state.eintraege = state.eintraege.filter(x => x.id !== e.id);
                  speichern();
                  aktualisiere(key);
                  zeichne();
                })
              }, muellIcon())));
      karte.append(zeile);
    }
  };
  zeichne();
}

// Stellt die Auswahl, die Knöpfe und den Zeitstrahl einer Disziplin auf den aktuellen Stand.
function aktualisiere(key) {
  const ui = UI[key];
  if (!ui) return;
  const liste = skisDerDisziplin(key);
  const aktiv = aktiverSki(key);

  ui.skiAuswahl.innerHTML = '';
  if (!liste.length) ui.skiAuswahl.append(h('option', { value: '' }, 'Noch kein Ski'));
  for (const s of liste) {
    ui.skiAuswahl.append(h('option', { value: s.id }, skiBeschriftung(s)));
  }
  ui.skiAuswahl.value = aktiv ? aktiv.id : '';

  // Skis für den Eintrag: die Auswahl bleibt, bis oben ein anderer Ski gewählt wird
  if (aktiv && ui.skiWahlFuer !== aktiv.id) {
    ui.skiWahl = new Set([aktiv.id]);
    ui.skiWahlFuer = aktiv.id;
  }
  ui.skiWahl = new Set([...ui.skiWahl].filter(id => liste.some(x => x.id === id)));
  ui.eintragSkis.innerHTML = '';
  for (const x of liste) {
    ui.eintragSkis.append(h('label', { class: 'check' },
      h('input', {
        type: 'checkbox',
        checked: ui.skiWahl.has(x.id) ? true : null,
        onchange: ev => { if (ev.target.checked) ui.skiWahl.add(x.id); else ui.skiWahl.delete(x.id); }
      }),
      skiBeschriftung(x)));
  }

  ui.entfernAuswahl.innerHTML = '';
  for (const s of liste) {
    ui.entfernAuswahl.append(h('option', { value: s.id }, skiBeschriftung(s)));
  }
  ui.entfernAuswahl.value = aktiv ? aktiv.id : '';

  const hatSki = Boolean(aktiv);
  ui.bereitKnopf.disabled = !hatSki;
  ui.skiEntfernen.disabled = !hatSki;
  ui.speichern.disabled = !hatSki;

  if (aktiv) {
    ui.bereitKnopf.textContent = aktiv.bereitSeit ? 'Ready zurücknehmen' : 'Ski ready';
    ui.bereitKnopf.className = aktiv.bereitSeit ? 'knopf-sekundaer' : 'knopf bereit-knopf';
    ui.bereitText.textContent = aktiv.bereitSeit ? 'Bereit seit ' + datumDE(aktiv.bereitSeit) : 'Nicht bereit';
  } else {
    ui.bereitKnopf.textContent = 'Ski ready';
    ui.bereitKnopf.className = 'knopf bereit-knopf';
    ui.bereitText.textContent = '';
  }

  const kanteBereit = Boolean(aktiv && aktiv.kanteBereitSeit);
  ui.kanteKnopf.disabled = !hatSki;
  ui.kanteKnopf.textContent = kanteBereit ? 'Kante ready zurücknehmen' : 'Kante ready';
  ui.kanteKnopf.className = kanteBereit ? 'knopf-sekundaer' : 'knopf';

  const ids = liste.map(s => s.id);
  zeichneKpi(ui.kpi, [
    [liste.length, 'Ski'],
    [state.eintraege.filter(e => ids.includes(e.ski)).length, 'Einträge'],
    [liste.filter(s => s.bereitSeit).length, 'Ski ready']
  ]);
  zeichneZeitstrahl(key, liste, aktiv);
}

// Kennzahlen als Zeile: Zahl oben, Beschriftung darunter
function zeichneKpi(box, werte) {
  box.textContent = '';
  for (const [zahl, text] of werte) {
    box.append(h('div', { class: 'kpi' },
      h('div', { class: 'kpi-zahl' }, String(zahl)),
      h('div', { class: 'kpi-text' }, text)));
  }
}

// Startseite: Zahlen aus dem ganzen Zustand
function zeichneHomeKpi() {
  if (!homeUI.kpi) return;
  zeichneKpi(homeUI.kpi, [
    [state.skis.length, 'Ski'],
    [state.eintraege.length, 'Einträge'],
    [aktiveWachse().length, 'Wachse aktiv']
  ]);
}

function alleAktualisieren() {
  for (const d of DISZIPLINEN) aktualisiere(d.key);
  baueWachsListe();
  zeichneHomeKpi();
}

// ============================================================
// 7. Aktionen: Ski, Ready, Einträge
// ============================================================

function skiHinzufuegen(key) {
  const ui = UI[key];
  // Kein Namensfeld: der Name ist die Disziplin, die Nummer kommt dazu
  const name = DISZIPLINEN.find(x => x.key === ui.neuDisziplin.value).titel;
  const ski = {
    id: neueId(),
    name,
    nummer: Number(ui.neuNummer.value),
    monat: Number(ui.neuMonat.value),
    jahr: Number(ui.neuJahr.value),
    disziplin: ui.neuDisziplin.value,
    steinski: ui.neuStein.checked,
    bereitSeit: null
  };
  state.skis.push(ski);
  aktuellerSki[ski.disziplin] = ski.id;
  ui.neuStein.checked = false;
  speichern();
  alleAktualisieren();
}

// Bestätigung direkt im Seitenbereich. Das Browserfenster confirm() ist in Claude blockiert.
function bestaetigeInline(box, text, onJa) {
  const frage = h('div', { class: 'zeile' },
    h('span', { class: 'hinweis' }, text),
    h('button', { class: 'knopf', type: 'button', onclick: () => { frage.remove(); onJa(); } }, 'Ja'),
    h('button', { class: 'knopf-sekundaer', type: 'button', onclick: () => frage.remove() }, 'Nein'));
  box.append(frage);
}

function skiEntfernen(key) {
  const ski = state.skis.find(s => s.id === UI[key].entfernAuswahl.value);
  if (!ski) return;
  bestaetigeInline(UI[key].entfernMeldung, `${ski.name} und alle Einträge löschen?`, () => {
    state.skis = state.skis.filter(s => s.id !== ski.id);
    state.eintraege = state.eintraege.filter(e => e.ski !== ski.id);
    aktuellerSki[key] = null;
    speichern();
    aktualisiere(key);
    UI[key].entfernMeldung.textContent = ski.name + ' entfernt.';
  });
}

// Kante-Ready-Knopf: merkt sich das Datum, an dem die Kanten bereit waren
function toggleKante(key) {
  const ski = aktiverSki(key);
  if (!ski) return;
  ski.kanteBereitSeit = ski.kanteBereitSeit ? null : heuteISO();
  speichern();
  aktualisiere(key);
}

// Ready-Knopf: setzt den Ski auf bereit (mit heutigem Datum) oder nimmt es zurück.
// Der Status bleibt, bis er von Hand geändert wird.
function toggleBereit(key) {
  const ski = aktiverSki(key);
  if (!ski) return;
  ski.bereitSeit = ski.bereitSeit ? null : heuteISO();
  speichern();
  aktualisiere(key);
}

// Kennung eines Eintrags ohne Datum und Ski: Art plus Wachs, Kanten oder Fahrten
function eintragSchluessel(e) {
  if (e.art === 'wachsen') return 'wachsen|' + e.wachsId;
  if (e.art === 'kanten') return 'kanten|' + e.kanten;
  const f = e.fahrten || {};
  return 'skifahren|' + [...(f.arten || [])].sort().join(',') + '|' + (f.abfahrten || 0)
    + '|' + [...(f.pisten || [])].sort().join(',') + '|' + [...(f.lauf || [])].sort().join(',') + '|' + (f.ranking || '');
}

function eintragSpeichern(key) {
  const ui = UI[key];
  ui.eintragMeldung.className = 'hinweis';
  const ziele = skisDerDisziplin(key).filter(x => ui.skiWahl.has(x.id));
  if (!ziele.length) {
    ui.eintragMeldung.textContent = 'Bitte mindestens einen Ski auswählen.';
    return;
  }

  const basis = {
    datum: ui.datum.value,
    art: ui.art.value,
    notiz: ui.notiz.value.trim()
  };
  if (!basis.datum) {
    ui.eintragMeldung.textContent = 'Bitte ein Datum wählen.';
    return;
  }

  if (basis.art === 'wachsen') {
    const wachsId = ui.artFelder.querySelector('[data-feld="wachs-rennen"]').value
      || ui.artFelder.querySelector('[data-feld="wachs-base"]').value;
    if (!wachsById(wachsId)) {
      ui.eintragMeldung.textContent = 'Bitte zuerst ein aktives Wachs auswählen.';
      return;
    }
    basis.wachsId = wachsId;
  } else if (basis.art === 'kanten') {
    basis.kanten = ui.artFelder.querySelector('[data-feld="kanten"]').value;
  } else {
    const arten = [...ui.artFelder.querySelectorAll('[data-feld="fahrt"]:checked')].map(c => c.value);
    const abfahrten = Math.max(0, Math.round(Number(ui.artFelder.querySelector('[data-feld="abfahrten"]').value) || 0));
    const pisten = [...ui.artFelder.querySelectorAll('[data-feld="piste"]:checked')].map(c => c.value);
    const lauf = [...ui.artFelder.querySelectorAll('[data-feld="lauf"]:checked')].map(c => c.value);
    const rankingWert = ui.artFelder.querySelector('[data-feld="ranking"]').value;
    basis.fahrten = { arten, abfahrten, pisten, lauf, ranking: rankingWert ? Number(rankingWert) : null };
  }

  const gespeichert = [];
  const schonDa = [];
  const bereitZurueck = [];
  for (const ski of ziele) {
    const eintrag = { id: neueId(), ski: ski.id, ...kopie(basis) };
    const doppelt = state.eintraege.some(x =>
      x.ski === ski.id && x.datum === eintrag.datum && eintragSchluessel(x) === eintragSchluessel(eintrag));
    if (doppelt) {
      schonDa.push(ski);
      continue;
    }
    state.eintraege.push(eintrag);
    gespeichert.push(ski);
    // Nach einer Ausfahrt ist der Ski nicht mehr bereit
    if (eintrag.art === 'skifahren' && ski.bereitSeit) {
      ski.bereitSeit = null;
      bereitZurueck.push(ski);
    }
  }

  if (!gespeichert.length) {
    ui.eintragMeldung.textContent = 'Schon vorhanden, nicht gespeichert.';
    return;
  }

  speichern();
  ui.notiz.value = '';
  aktualisiere(key);
  ui.eintragMeldung.className = 'bestaetigt';
  let text = 'Gespeichert.';
  if (schonDa.length) text += ` Schon vorhanden: ${schonDa.map(skiBeschriftung).join(', ')}.`;
  if (bereitZurueck.length) text += ' Ski ready zurückgesetzt.';
  ui.eintragMeldung.textContent = text;
}

function eintragLoeschen(key, e) {
  bestaetigeInline(UI[key].detail, 'Diesen Eintrag löschen?', () => {
    state.eintraege = state.eintraege.filter(x => x.id !== e.id);
    speichern();
    aktualisiere(key);
    UI[key].detail.textContent = 'Eintrag gelöscht.';
  });
}

// ============================================================
// 8. Zeitstrahl
// ============================================================

// Skis nach Nummer sortieren. Ohne Nummer kommen sie ans Ende, in ihrer bisherigen Reihenfolge.
function nachNummer(liste) {
  const wert = s => (s.nummer === undefined || s.nummer === null ? 99 : s.nummer);
  return [...liste].sort((a, b) => wert(a) - wert(b));
}

// Zeichnet je Ski eine Zeile auf einer gemeinsamen Datumsachse.
// Form = Art (Kreis Wachsen, Quadrat Kanten, Dreieck Skifahren).
function zeichneZeitstrahl(key, liste, aktiv) {
  const box = UI[key].zeitstrahl;
  box.innerHTML = '';
  if (!liste.length) {
    box.append(h('p', { class: 'leer' }, 'Noch keine Ski in dieser Disziplin.'));
    return;
  }

  const ids = liste.map(s => s.id);
  const eintraege = state.eintraege.filter(e => ids.includes(e.ski));
  const jetzt = zeitpunkt(heuteISO());
  const zeiten = eintraege.length
    ? eintraege.map(e => zeitpunkt(e.datum))
    : [jetzt - 30 * TAG, jetzt + 30 * TAG];
  const min = Math.min(...zeiten) - 7 * TAG;
  const max = Math.max(...zeiten) + 7 * TAG;
  const x = t => PAD + ((t - min) / (max - min)) * (W - 2 * PAD);

  // Monatsmarken
  const monate = [];
  const m = new Date(min);
  m.setDate(1);
  m.setHours(12, 0, 0, 0);
  if (m.getTime() < min) m.setMonth(m.getMonth() + 1);
  while (m.getTime() <= max) {
    monate.push(new Date(m.getTime()));
    m.setMonth(m.getMonth() + 1);
  }

  for (const ski of nachNummer(liste)) {
    const eigene = eintraege
      .filter(e => e.ski === ski.id)
      .sort((a, b) => a.datum.localeCompare(b.datum));
    const istAktiv = Boolean(aktiv) && ski.id === aktiv.id;

    const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Zeitstrahl ' + ski.name });
    const kopf = h('div', {
      class: 'ski-kopf',
      onclick: () => {
        aktuellerSki[key] = ski.id;
        aktualisiere(key);
      }
    },
      h('span', { class: 'ski-name' }, ski.name,
        ski.nummer !== undefined && ski.nummer !== null ? h('strong', {}, ' ' + ski.nummer) : null,
        ski.monat && ski.jahr ? h('span', { class: 'ski-datum' }, ' · ' + String(ski.monat).padStart(2, '0') + '/' + ski.jahr) : null),
      h('span', { class: 'ski-meta' },
        ski.bereitSeit ? h('span', { class: 'ski-bereit' }, 'READY') : null,
        eigene.length + (eigene.length === 1 ? ' Eintrag' : ' Einträge') + (ski.steinski ? ' · Steinski' : '')),
      h('span', { class: 'ski-aktionen' },
        h('button', { class: 'icon-knopf', type: 'button', title: 'Zeitstrahl öffnen', 'aria-label': 'Zeitstrahl öffnen',
          disabled: eigene.length === 0,
          onclick: ev => { ev.stopPropagation(); zeigeEintragFenster(key, ski, eigene[eigene.length - 1]); } }, oeffnenIcon())));
    box.append(h('div', { class: 'ski' + (ski.bereitSeit ? ' bereit' : '') + (ski.kanteBereitSeit ? ' kante' : '') + (istAktiv ? ' aktiv' : '') }, kopf, svg));

    // Tippen auf den Zeitstrahl zeigt den ganzen Verlauf dieses Skis
    svg.style.cursor = 'pointer';
    svg.addEventListener('click', () => zeigeVerlauf(key, ski, eigene));

    svgEl('line', { x1: PAD, x2: W - PAD, y1: BASE_Y, y2: BASE_Y, class: 'baseline' }, svg);
    for (const d of monate) {
      const tx = x(d.getTime());
      svgEl('line', { x1: tx, x2: tx, y1: BASE_Y, y2: BASE_Y + 5, class: 'tick' }, svg);
      const beschriftung = svgEl('text', { x: tx, y: BASE_Y + 18, 'text-anchor': 'middle', class: 'axis-label' }, svg);
      beschriftung.textContent = MONATE[d.getMonth()];
    }
    if (!eigene.length) {
      const leer = svgEl('text', { x: W / 2, y: 20, 'text-anchor': 'middle', class: 'axis-label' }, svg);
      leer.textContent = 'Noch keine Einträge';
    }

    // Mehrere Einträge am selben Tag werden übereinander gestapelt
    const gezaehlt = {};
    for (const e of eigene) {
      const cx = x(zeitpunkt(e.datum));
      gezaehlt[e.datum] = (gezaehlt[e.datum] || 0) + 1;
      const cy = BASE_Y - 8 - (gezaehlt[e.datum] - 1) * 14;

      let punkt;
      if (e.art === 'kanten') {
        punkt = svgEl('rect', { x: cx - 6, y: cy - 6, width: 12, height: 12 }, svg);
      } else if (e.art === 'skifahren') {
        punkt = svgEl('path', { d: `M${cx} ${cy - 8} L${cx + 8} ${cy + 6} L${cx - 8} ${cy + 6} Z` }, svg);
      } else {
        punkt = svgEl('circle', { cx: cx, cy: cy, r: 7 }, svg);
      }
      punkt.setAttribute('class', 'dot');
      punkt.setAttribute('fill', symbolFarbe(e.art));
      punkt.setAttribute('tabindex', '0');
      const oeffnen = ev => {
        ev.stopPropagation(); // nicht zusätzlich den ganzen Verlauf öffnen
        zeigeDetail(key, ski, e, punkt);
      };
      punkt.addEventListener('click', oeffnen);
      punkt.addEventListener('keydown', ev => { if (ev.key === 'Enter') oeffnen(ev); });
      langDruecken(punkt, () => zeigeEintragFenster(key, ski, e));
    }
  }
}

// Kurztext zu einem Eintrag: Wachs, Kanten oder Fahrten
function eintragKurz(e) {
  if (e.art === 'wachsen') {
    const w = wachsById(e.wachsId);
    return w ? `${w.marke} · ${w.name} (${w.typ === 'hart' ? 'Hart' : 'Flüssig'})` : 'gelöschtes Wachs';
  }
  if (e.art === 'kanten') return KANTEN_OPTIONEN[e.kanten] || '–';
  const namen = ((e.fahrten && e.fahrten.arten) || [])
    .map(id => (FAHRTARTEN.find(f => f.id === id) || {}).name)
    .filter(Boolean);
  const f = e.fahrten || {};
  const pisten = (f.pisten || []).map(id => (PISTENVERHAELTNISSE.find(x => x.id === id) || {}).name).filter(Boolean);
  const lauf = (f.lauf || []).map(id => (LAUFARTEN.find(x => x.id === id) || {}).name).filter(Boolean);
  return [namen.length ? namen.join(', ') : '–', (f.abfahrten || 0) + ' Abfahrten',
    pisten.length ? 'Piste: ' + pisten.join(', ') : null,
    lauf.length ? 'Lauf: ' + lauf.join(', ') : null,
    f.ranking ? 'Ranking ' + f.ranking + '/10' : null].filter(Boolean).join(' · ');
}

// Listet alle Einträge eines Skis, neueste zuerst.
function zeigeVerlauf(key, ski, eigene) {
  document.querySelectorAll('.dot.aktiv-punkt').forEach(n => n.classList.remove('aktiv-punkt'));
  const box = UI[key].detail;
  box.innerHTML = '';
  box.append(h('div', { style: 'font-weight:600' }, `${ski.name} · Verlauf (${eigene.length} Einträge)`));
  if (!eigene.length) {
    box.append(h('div', { class: 'leer' }, 'Noch keine Einträge.'));
    return;
  }
  for (const e of [...eigene].reverse()) {
    box.append(h('div', { style: 'margin-top:10px; padding-top:8px; border-top:1px solid var(--linie)' },
      h('div', {}, h('span', { class: 'k' }, datumDE(e.datum) + ' · ' + ARTEN[e.art])),
      h('div', {}, eintragKurz(e)),
      e.notiz ? h('div', { class: 'k' }, e.notiz) : null
    ));
  }
}

// Formular zum Ändern eines Eintrags. Die Art (Wachsen, Kanten, Skifahren) bleibt gleich.
function bearbeiteEintrag(key, ski, e, zielBox = UI[key].detail, nachEnde = null) {
  const box = zielBox;
  box.innerHTML = '';
  const datum = h('input', { class: 'feld', type: 'date', value: e.datum });
  const notiz = h('input', { class: 'feld', type: 'text', maxlength: '120', value: e.notiz || '' });

  let artFeld;
  if (e.art === 'wachsen') {
    artFeld = h('select', { class: 'feld' },
      state.wachse.filter(w => w.aktiv || w.id === e.wachsId).map(w =>
        h('option', { value: w.id, selected: w.id === e.wachsId ? true : null }, `${w.marke} · ${w.name} (${w.typ === 'hart' ? 'Hart' : 'Flüssig'})`)));
  } else if (e.art === 'kanten') {
    artFeld = h('select', { class: 'feld' },
      Object.entries(KANTEN_OPTIONEN).map(([id, name]) =>
        h('option', { value: id, selected: id === e.kanten ? true : null }, name)));
  } else {
    const gewaehlt = (e.fahrten && e.fahrten.arten) || [];
    artFeld = h('div', {},
      h('div', { class: 'checkgruppe' },
        FAHRTARTEN.map(f => h('label', { class: 'check' },
          h('input', { type: 'checkbox', value: f.id, checked: gewaehlt.includes(f.id) ? true : null, 'data-fahrt': '1' }),
          f.name))),
      h('label', { class: 'lbl' }, 'Anzahl Abfahrten'),
      h('input', { class: 'feld', type: 'number', min: '0', step: '1', value: String((e.fahrten && e.fahrten.abfahrten) || 0), 'data-abf': '1' }),
      h('label', { class: 'lbl' }, 'Pistenverhältnisse'),
      h('div', { class: 'checkgruppe' },
        PISTENVERHAELTNISSE.map(p => h('label', { class: 'check' },
          h('input', { type: 'checkbox', value: p.id, checked: ((e.fahrten && e.fahrten.pisten) || []).includes(p.id) ? true : null, 'data-piste': '1' }),
          p.name))),
      h('label', { class: 'lbl' }, 'Lauf'),
      h('div', { class: 'checkgruppe' },
        LAUFARTEN.map(l => h('label', { class: 'check' },
          h('input', { type: 'checkbox', value: l.id, checked: ((e.fahrten && e.fahrten.lauf) || []).includes(l.id) ? true : null, 'data-lauf': '1' }),
          l.name))),
      h('label', { class: 'lbl' }, 'Ranking'),
      h('select', { class: 'feld', 'data-rank': '1' },
        [h('option', { value: '' }, '—'),
          ...Array.from({ length: 10 }, (_, i) => h('option', { value: String(i + 1), selected: (e.fahrten && e.fahrten.ranking) === i + 1 ? true : null }, String(i + 1)))]));
  }

  box.append(
    h('div', { style: 'font-weight:600' }, `${ski.name} · ${ARTEN[e.art]} bearbeiten`),
    h('label', { class: 'lbl' }, 'Tag'), datum,
    h('label', { class: 'lbl' }, e.art === 'wachsen' ? 'Wachs' : e.art === 'kanten' ? 'Kanten' : 'Fahrten'), artFeld,
    h('label', { class: 'lbl' }, 'Notiz'), notiz,
    h('div', { class: 'zeile' },
      h('button', {
        class: 'knopf', type: 'button',
        onclick: () => {
          e.datum = datum.value || e.datum;
          e.notiz = notiz.value.trim();
          if (e.art === 'wachsen') {
            e.wachsId = artFeld.value;
          } else if (e.art === 'kanten') {
            e.kanten = artFeld.value;
          } else {
            e.fahrten = {
              arten: [...artFeld.querySelectorAll('[data-fahrt]:checked')].map(c => c.value),
              abfahrten: Math.max(0, Math.round(Number(artFeld.querySelector('[data-abf]').value) || 0)),
              pisten: [...artFeld.querySelectorAll('[data-piste]:checked')].map(c => c.value),
              lauf: [...artFeld.querySelectorAll('[data-lauf]:checked')].map(c => c.value),
              ranking: artFeld.querySelector('[data-rank]').value ? Number(artFeld.querySelector('[data-rank]').value) : null
            };
          }
          speichern();
          aktualisiere(key);
          if (box === UI[key].detail) UI[key].detail.textContent = 'Eintrag geändert.';
          if (nachEnde) nachEnde();
        }
      }, 'Speichern'),
      h('button', { class: 'knopf-sekundaer', type: 'button', onclick: () => (nachEnde ? nachEnde() : (box === UI[key].detail ? zeigeDetail(key, ski, e, null) : aktualisiere(key))) }, 'Abbrechen')));
}

function zeigeDetail(key, ski, e, punkt) {
  document.querySelectorAll('.dot.aktiv-punkt').forEach(n => n.classList.remove('aktiv-punkt'));
  if (punkt) punkt.classList.add('aktiv-punkt');

  const box = UI[key].detail;
  box.innerHTML = '';

  const zeilen = [];
  if (e.art === 'wachsen') {
    const w = wachsById(e.wachsId);
    zeilen.push(['Wachs', w ? `${w.marke} · ${w.name} (${w.typ === 'hart' ? 'Hart' : 'Flüssig'})` : 'gelöschtes Wachs']);
  } else if (e.art === 'kanten') {
    zeilen.push(['Kanten', KANTEN_OPTIONEN[e.kanten] || '–']);
  } else {
    const namen = ((e.fahrten && e.fahrten.arten) || [])
      .map(id => (FAHRTARTEN.find(f => f.id === id) || {}).name)
      .filter(Boolean);
    zeilen.push(['Fahrten', namen.length ? namen.join(', ') : '–']);
    zeilen.push(['Abfahrten', String((e.fahrten && e.fahrten.abfahrten) || 0)]);
    const pistenNamen = ((e.fahrten && e.fahrten.pisten) || []).map(id => (PISTENVERHAELTNISSE.find(p => p.id === id) || {}).name).filter(Boolean);
    const laufNamen = ((e.fahrten && e.fahrten.lauf) || []).map(id => (LAUFARTEN.find(l => l.id === id) || {}).name).filter(Boolean);
    if (pistenNamen.length) zeilen.push(['Pisten', pistenNamen.join(', ')]);
    if (laufNamen.length) zeilen.push(['Lauf', laufNamen.join(', ')]);
    if (e.fahrten && e.fahrten.ranking) zeilen.push(['Ranking', e.fahrten.ranking + ' / 10']);
  }
  if (e.notiz) zeilen.push(['Notiz', e.notiz]);

  box.append(h('div', { style: 'font-weight:600' }, `${ski.name} · ${datumDE(e.datum)} · ${ARTEN[e.art]}`));
  for (const [k, v] of zeilen) {
    box.append(h('div', {}, h('span', { class: 'k' }, k + ': '), v));
  }
  box.append(h('div', { class: 'zeile' },
    h('button', { class: 'icon-knopf', type: 'button', title: 'Eintrag im Fenster öffnen', 'aria-label': 'Eintrag im Fenster öffnen', onclick: () => zeigeEintragFenster(key, ski, e) }, oeffnenIcon()),
    h('button', { class: 'knopf', type: 'button', onclick: () => bearbeiteEintrag(key, ski, e) }, 'Bearbeiten'),
    h('button', { class: 'knopf-sekundaer', type: 'button', onclick: () => eintragLoeschen(key, e) }, 'Eintrag löschen')));
}

// ============================================================
// 9. Start und Routing
// ============================================================

const ROUTEN = ['home', ...DISZIPLINEN.map(d => d.key)];

function route() {
  let name = location.hash.replace(/^#\/?/, '') || 'home';
  if (!ROUTEN.includes(name)) name = 'home';
  document.querySelectorAll('main > section').forEach(s => s.classList.toggle('aktiv', s.id === name));
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('aktiv', a.dataset.route === name));
  if (name !== 'home') aktualisiere(name);
  else zeichneHomeKpi();
  window.scrollTo(0, 0);
}

window.addEventListener('scroll', () => {
  document.querySelector('header').classList.toggle('klein', window.scrollY > 24);
}, { passive: true });

baueHome();
for (const d of DISZIPLINEN) baueDisziplin(d);
alleAktualisieren();
window.addEventListener('hashchange', route);
route();
</script>
