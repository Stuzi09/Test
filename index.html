<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stuwax">
<meta name="theme-color" content="#0c2340">
<title>Stuwax</title>
<style>
  :root {
    --bg: #0c2340;
    --panel: #12305a;
    --text: #ffffff;
    --muted: #9fb3cf;
    --accent: #ff7a1a;
    --line: #3a5a84;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.4;
  }
  header {
    background: var(--panel);
    padding: 12px 16px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 18px;
  }
  .logo { font-weight: 700; font-size: 1.1rem; margin-right: auto; }
  nav { display: flex; flex-wrap: wrap; gap: 6px 14px; }
  nav a { color: var(--muted); text-decoration: none; padding-bottom: 3px; border-bottom: 2px solid transparent; }
  nav a:hover { color: var(--text); }
  nav a.aktiv { color: var(--text); border-bottom-color: var(--accent); }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  main > section { display: none; }
  main > section.aktiv { display: block; }
  h1 { font-size: 1.3rem; margin: 6px 0 12px; }
  h2 { font-size: 1rem; margin: 0 0 10px; }
  .beschreibung { color: var(--muted); margin: 0 0 12px; }
  .panel { background: var(--panel); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  .lbl { display: block; font-size: .85rem; color: var(--muted); margin: 10px 0 4px; }
  .feld {
    width: 100%;
    padding: 9px 10px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);
    font-size: 1rem;
  }
  .zeile { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .zeile > * { flex: 1 1 auto; }
  .knopf, .knopf-sekundaer {
    padding: 10px 14px;
    border-radius: 6px;
    font-size: .95rem;
    font-weight: 700;
    cursor: pointer;
    border: 1px solid transparent;
    text-align: center;
  }
  .knopf { background: var(--accent); color: var(--bg); }
  .knopf-sekundaer { background: transparent; color: var(--text); border-color: var(--line); }
  .knopf:disabled, .knopf-sekundaer:disabled { opacity: .45; cursor: default; }
  .checkgruppe { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 4px; }
  .check { color: var(--text); font-size: .95rem; display: inline-flex; align-items: center; gap: 6px; }
  .wachsliste label { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: .95rem; }
  .hinweis { color: var(--muted); font-size: .85rem; margin-top: 6px; min-height: 1.2em; }
  .ergebnis { border-left: 4px solid var(--accent); padding-left: 12px; margin-top: 14px; }
  .wachs-name { font-weight: 700; font-size: 1.05rem; }
  .ski { background: var(--panel); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; border: 2px solid transparent; }
  .ski.bereit { border-color: #3ecf6e; }
  .ski.aktiv { outline: 2px solid var(--accent); outline-offset: 3px; }
  .ski-bereit { color: #3ecf6e; font-weight: 700; }
  .ski-kopf { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 4px; cursor: pointer; }
  .ski-name { font-weight: 600; }
  .ski-meta { color: var(--muted); font-size: .85rem; }
  svg { width: 100%; height: auto; display: block; overflow: visible; }
  .baseline { stroke: var(--line); stroke-width: 2; }
  .tick { stroke: var(--line); stroke-width: 1; }
  .axis-label { fill: var(--muted); font-size: 11px; }
  .dot { cursor: pointer; stroke: none; }
  .dot:hover, .dot:focus, .dot.aktiv-punkt { stroke: #fff; stroke-width: 2; outline: none; }
  .legende { color: var(--muted); font-size: .8rem; margin: 6px 0 0; display: flex; gap: 14px; flex-wrap: wrap; }
  .detail {
    background: var(--panel);
    border-left: 4px solid var(--accent);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: .92rem;
    min-height: 3.2em;
    margin-top: 12px;
  }
  .detail .k { color: var(--muted); }
  .leer { color: var(--muted); font-style: italic; }
  .trenner { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
</style>
</head>
<body>

<header>
  <div class="logo">Stuwax</div>
  <nav>
    <a href="#/" data-route="home">Wachsrechner</a>
    <a href="#/slalom" data-route="slalom">Slalom</a>
    <a href="#/riesenslalom" data-route="riesenslalom">Riesenslalom</a>
    <a href="#/super-g" data-route="super-g">Super-G</a>
    <a href="#/abfahrt" data-route="abfahrt">Abfahrt</a>
  </nav>
</header>

<main>
  <section id="home"></section>
  <section id="slalom"></section>
  <section id="riesenslalom"></section>
  <section id="super-g"></section>
  <section id="abfahrt"></section>
</main>

<script>
'use strict';

// ============================================================
// 1. Konstanten und Beispieldaten
// ============================================================

const STORAGE_KEY = 'stuwax-v1';
const TAG = 86400000;
const SVG_NS = 'http://www.w3.org/2000/svg';
const W = 600, H = 60, PAD = 24, BASE_Y = 30;
const MONATE = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];
const FARBEN = ['#7f9cc4', '#a9bfdc', '#dfe8f3', '#f7b07a', '#ff7a1a']; // Bewertung 1 bis 5

const DISZIPLINEN = [
  { key: 'slalom', titel: 'Slalom', text: 'Kurze Tore, enge Radien, viel Kantenarbeit.' },
  { key: 'riesenslalom', titel: 'Riesenslalom', text: 'Tore etwas weiter auseinander als im Slalom, schnellere Schwünge.' },
  { key: 'super-g', titel: 'Super-G', text: 'Lange Schwünge bei hohem Tempo, Tore weit auseinander.' },
  { key: 'abfahrt', titel: 'Abfahrt', text: 'Höchstes Tempo, wenige Tore. Gleiten ist hier am wichtigsten.' }
];

const ARTEN = { wachsen: 'Wachsen', kanten: 'Kanten', skifahren: 'Skifahren' };

const KANTEN_OPTIONEN = { diamant: 'Nur mit Diamant', diamant_feile: 'Diamant und Feile' };

const FAHRTARTEN = [
  { id: 'piste', name: 'Piste' },
  { id: 'tiefschnee', name: 'Tiefschnee' },
  { id: 'training', name: 'Training' },
  { id: 'rennen', name: 'Rennen' },
  { id: 'tour', name: 'Tour' }
];

// Vola: je Typ (Flüssig, Hart) drei Linien (LM, HM, Moly) in vier Farben, also 24 Wachse
const VOLA_FAMILIEN_NAMEN = { LM: 'LM Race', HM: 'HM Race', LMMOLY: 'LM Race MOLY', HMMOLY: 'HM Race MOLY' };
const VOLA_ZONE_NAMEN = { blau: 'Blau', violett: 'Violett', rot: 'Rot', gelb: 'Gelb' };
// Vola-Basewachse (Beta-Wachse)
const VOLA_BASE_HART = ['Base Hard', 'Base Medium', 'Base Medium Race', 'Base Soft', 'Base Soft Race',
  'Premium MX901', 'Graphite', 'Graphite LM', 'VRB', 'X-Hard', 'MX-E Gelb', 'MX-E Rot', 'MX-E Violett', 'MX-E Blau'];
const VOLA_BASE_FLUESSIG = ['MX-E Gelb', 'MX-E Rot', 'MX-E Violett', 'MX-E Blau'];

function baueVolaWachse() {
  const liste = [];
  let n = 1;
  for (const typ of ['fluessig', 'hart']) {
    for (const linie of ['LM', 'HM', 'LMMOLY', 'HMMOLY']) {
      for (const farbe of Object.keys(VOLA_ZONE_NAMEN)) {
        // Moly ist standardmässig aus, da nur zwei Farben pro Linie vorhanden sind
        const aktiv = !linie.endsWith('MOLY');
        liste.push({ id: 'w' + n++, marke: 'Vola', name: `${VOLA_FAMILIEN_NAMEN[linie]} ${VOLA_ZONE_NAMEN[farbe]}`, typ, aktiv, kategorie: 'rennwachs' });
      }
    }
  }
  for (const name of VOLA_BASE_HART) {
    liste.push({ id: 'w' + n++, marke: 'Vola', name, typ: 'hart', aktiv: true, kategorie: 'basewachs' });
  }
  for (const name of VOLA_BASE_FLUESSIG) {
    liste.push({ id: 'w' + n++, marke: 'Vola', name, typ: 'fluessig', aktiv: true, kategorie: 'basewachs' });
  }
  return liste;
}

// Beispieldaten. Die Wachse werden später durch das Foto-Inventar ersetzt.
const DEMO = {
  skis: [
    { id: 'a', name: 'Ski A', laenge: 170, disziplin: 'slalom', bereitSeit: null },
    { id: 'b', name: 'Ski B', laenge: 165, disziplin: 'riesenslalom', bereitSeit: null },
    { id: 'c', name: 'Ski C', laenge: 178, disziplin: 'abfahrt', bereitSeit: '2027-02-18' },
    { id: 'd', name: 'Ski D', laenge: 180, disziplin: 'super-g', bereitSeit: null }
  ],
  wachse: baueVolaWachse(),
  eintraege: [
    { id: 'e1', ski: 'a', datum: '2026-12-04', art: 'wachsen', wachsId: 'w1', bewertung: 4, notiz: 'Gute Gleitfähigkeit' },
    { id: 'e2', ski: 'a', datum: '2026-12-12', art: 'wachsen', wachsId: 'w2', bewertung: 3, notiz: '' },
    { id: 'e3', ski: 'a', datum: '2027-01-08', art: 'wachsen', wachsId: 'w2', bewertung: 5, notiz: 'Sehr schnell' },
    { id: 'e4', ski: 'a', datum: '2027-01-20', art: 'skifahren', fahrten: { arten: ['piste', 'training'], abfahrten: 14 }, bewertung: 4, notiz: '' },
    { id: 'e5', ski: 'a', datum: '2027-02-03', art: 'wachsen', wachsId: 'w2', bewertung: 2, notiz: 'Zu nass, Ski klebte' },
    { id: 'e6', ski: 'b', datum: '2026-12-04', art: 'wachsen', wachsId: 'w1', bewertung: 3, notiz: '' },
    { id: 'e7', ski: 'b', datum: '2027-01-15', art: 'wachsen', wachsId: 'w2', bewertung: 4, notiz: '' },
    { id: 'e8', ski: 'c', datum: '2027-01-08', art: 'wachsen', wachsId: 'w2', bewertung: 4, notiz: '' },
    { id: 'e9', ski: 'c', datum: '2027-02-19', art: 'kanten', kanten: 'diamant', bewertung: 3, notiz: '' },
    { id: 'e10', ski: 'c', datum: '2027-02-19', art: 'wachsen', wachsId: 'w1', bewertung: 5, notiz: '' },
    { id: 'e11', ski: 'c', datum: '2027-02-20', art: 'skifahren', fahrten: { arten: ['tiefschnee'], abfahrten: 6 }, bewertung: 5, notiz: '' }
  ]
};

// ============================================================
// 2. Hilfsfunktionen
// ============================================================

function kopie(obj) {
  return JSON.parse(JSON.stringify(obj));
}

// Baut ein DOM-Element. Attribute, die mit "on" beginnen, werden als Ereignis registriert.
function h(tag, attrs, ...kinder) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v === true ? '' : String(v));
  }
  for (const kind of kinder.flat()) {
    if (kind === null || kind === undefined || kind === false) continue;
    node.append(kind instanceof Node ? kind : document.createTextNode(String(kind)));
  }
  return node;
}

function svgEl(name, attrs, parent) {
  const node = document.createElementNS(SVG_NS, name);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (parent) parent.appendChild(node);
  return node;
}

function heuteISO() {
  const t = new Date();
  const monat = String(t.getMonth() + 1).padStart(2, '0');
  const tag = String(t.getDate()).padStart(2, '0');
  return `${t.getFullYear()}-${monat}-${tag}`;
}

function zeitpunkt(datum) {
  return new Date(datum + 'T12:00:00').getTime();
}

function datumDE(iso) {
  return new Date(iso + 'T12:00:00').toLocaleDateString('de-CH', { day: 'numeric', month: 'short', year: 'numeric' });
}

function neueId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

// Vola Race: welches Produkt zu Schneeart und Farbe passt (nach der Vola-Tabelle).
const VOLA_FARBEN ={ blau: '#1f5fa8', violett: '#7b2a7d', rot: '#d62a2a', gelb: '#f5d400' };
const VOLA_TABELLE = {
  neu: { blau: ['LM', 'HM'], violett: ['LM', 'HM'], rot: ['LM'], gelb: ['LM'] },
  alt: { blau: ['HM'], violett: ['LM', 'HM'], rot: ['LM', 'HM'], gelb: ['LM', 'HM'] },
  kunst: { blau: ['LMMOLY', 'HMMOLY'], violett: ['LMMOLY', 'HMMOLY'], rot: ['LMMOLY', 'HMMOLY'], gelb: ['LMMOLY', 'HMMOLY'] }
};
const SCHNEEART_SCHLUESSEL = { Neuschnee: 'neu', Altschnee: 'alt', Firn: 'alt', Kunstschnee: 'kunst' };

// Farbe nach Lufttemperatur. Die Bereiche der Tabelle überlappen,
// hier gilt: bis -10 blau, bis -4 violett, bis 0 rot, darüber gelb.
function volaZone(t) {
  if (t <= -10) return 'blau';
  if (t <= -4) return 'violett';
  if (t <= 0) return 'rot';
  return 'gelb';
}

// ============================================================
// 3. Speicherung
// ============================================================

function ladeState() {
  try {
    const roh = localStorage.getItem(STORAGE_KEY);
    if (roh) {
      const daten = JSON.parse(roh);
      // Gespeicherte Fremdmarken durch die Wöhler-Wachse ersetzen
      if (Array.isArray(daten.wachse)) {
        // Typ (Flüssig/Hart) aus den Vorgaben übernehmen
        daten.wachse.forEach(w => {
          const d = DEMO.wachse.find(x => x.name === w.name);
          if (d) {
            w.typ = d.typ;
            w.kategorie = d.kategorie;
          }
        });
      }
      if (Array.isArray(daten.wachse) && (daten.wachse.length !== DEMO.wachse.length
          || daten.wachse.some(w => !DEMO.wachse.some(d => d.name === w.name)))) {
        daten.wachse = kopie(DEMO.wachse);
      }
      return daten;
    }
  } catch (err) {
    console.warn('Gespeicherte Daten konnten nicht gelesen werden', err);
  }
  return kopie(DEMO);
}

function speichern() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.warn('Speichern im Browser nicht möglich', err);
  }
}

let state = ladeState();

// ============================================================
// 4. Zugriffe auf den Zustand
// ============================================================

const wachsById = id => state.wachse.find(w => w.id === id);
const aktiveWachse = () => state.wachse.filter(w => w.aktiv);
const skisDerDisziplin = key => state.skis.filter(s => s.disziplin === key);

// Gewählter Ski einer Disziplin. Fällt auf den ersten Ski zurück.
function aktiverSki(key) {
  const liste = skisDerDisziplin(key);
  let ski = liste.find(s => s.id === aktuellerSki[key]);
  if (!ski) ski = liste[0];
  aktuellerSki[key] = ski ? ski.id : null;
  return ski || null;
}

const UI = {};            // Oberflächenelemente pro Disziplin
const homeUI = {};        // Oberflächenelemente der Startseite
const aktuellerSki = {};  // Disziplin -> ID des gewählten Skis

// ============================================================
// 5. Startseite: Wachsrechner, Wachse, Daten
// ============================================================

function baueHome() {
  const sektion = document.getElementById('home');

  homeUI.luft = h('input', { class: 'feld', id: 'luft', type: 'number', step: '0.5', value: '-6' });
  homeUI.schnee = h('input', { class: 'feld', id: 'schnee', type: 'number', step: '0.5', value: '-8' });
  homeUI.feuchte = h('input', { class: 'feld', id: 'feuchte', type: 'number', step: '1', min: '0', max: '100', value: '60' });
  homeUI.zustand = h('select', { class: 'feld', id: 'zustand' },
    h('option', { value: 'trocken' }, 'trocken'),
    h('option', { value: 'nass' }, 'nass'));
  homeUI.schneeart = h('select', { class: 'feld', id: 'schneeart' },
    ['Neuschnee', 'Altschnee', 'Kunstschnee', 'Firn'].map(a => h('option', { value: a }, a)));
  homeUI.ergebnis = h('div', { class: 'ergebnis' });
  homeUI.wachsListe = h('div', { class: 'wachsliste' });
  homeUI.meldung = h('div', { class: 'hinweis' });

  sektion.append(
    h('h1', {}, 'Wachsrechner'),
    h('div', { class: 'panel' },
      h('label', { class: 'lbl', for: 'luft' }, 'Lufttemperatur (°C)'), homeUI.luft,
      h('label', { class: 'lbl', for: 'schnee' }, 'Schneetemperatur (°C)'), homeUI.schnee,
      h('label', { class: 'lbl', for: 'feuchte' }, 'Luftfeuchtigkeit (%)'), homeUI.feuchte,
      h('label', { class: 'lbl', for: 'zustand' }, 'Schnee'), homeUI.zustand,
      h('label', { class: 'lbl', for: 'schneeart' }, 'Schneeart'), homeUI.schneeart,
      h('div', { class: 'zeile' },
        h('button', { class: 'knopf', type: 'button', onclick: wachsrechnerStart }, 'Wachs empfehlen')),
      homeUI.ergebnis
    ),
    h('div', { class: 'panel' },
      h('h2', {}, 'Meine Wachse'),
      h('p', { class: 'beschreibung' }, 'Nur aktive Wachse werden empfohlen und in den Einträgen angeboten.'),
      homeUI.wachsListe
    ),
    h('div', { class: 'panel' },
      h('h2', {}, 'Daten'),
      h('div', { class: 'zeile' },
        h('button', { class: 'knopf-sekundaer', type: 'button', onclick: exportieren }, 'Exportieren'),
        h('label', { class: 'knopf-sekundaer', style: 'cursor:pointer' },
          'Importieren',
          h('input', { type: 'file', accept: 'application/json', style: 'display:none', onchange: importVonDatei })),
        h('button', { class: 'knopf-sekundaer', type: 'button', onclick: zuruecksetzen }, 'Zurücksetzen')
      ),
      homeUI.meldung
    )
  );
}

function wachsrechnerStart() {
  const luft = Number(homeUI.luft.value);
  const schneeart = homeUI.schneeart.value;
  const zone = volaZone(luft);
  const linien = VOLA_TABELLE[SCHNEEART_SCHLUESSEL[schneeart]][zone];
  const namen = linien.map(l => `${VOLA_FAMILIEN_NAMEN[l]} ${VOLA_ZONE_NAMEN[zone]}`);
  const passende = aktiveWachse().filter(x => namen.includes(x.name));

  homeUI.ergebnis.innerHTML = '';
  homeUI.ergebnis.append(
    h('div', { class: 'wachs-name' },
      h('span', { style: `display:inline-block;width:14px;height:14px;border-radius:50%;background:${VOLA_FARBEN[zone]};margin-right:6px;vertical-align:middle` }),
      'Vola: ' + namen.join(' oder ')),
    h('div', { class: 'hinweis' }, `${schneeart}, Lufttemperatur ${luft} °C, Farbe ${VOLA_ZONE_NAMEN[zone]}.`),
    h('div', { class: 'hinweis' }, 'Trocken oder nass ändert nur die Härte innerhalb des Produkts. Das zeigt die App nicht.'),
    passende.length
      ? h('div', { class: 'hinweis' }, 'Aktiv bei dir: ' + passende.map(x => `${x.name} (${x.typ === 'hart' ? 'Hart' : 'Flüssig'})`).join(', '))
      : h('div', { class: 'hinweis' }, 'Keines dieser Produkte ist aktiv. Unter „Meine Wachse“ aktivieren.')
  );
}

function baueWachsListe() {
  homeUI.wachsListe.innerHTML = '';
  for (const [typ, titel] of [['fluessig', 'Flüssig'], ['hart', 'Hart']]) {
    homeUI.wachsListe.append(h('h3', { style: 'font-size:.95rem; margin:12px 0 4px; color:var(--muted)' }, titel));
    for (const w of state.wachse.filter(x => x.typ === typ)) {
      homeUI.wachsListe.append(
        h('label', {},
          h('input', {
            type: 'checkbox',
            checked: w.aktiv ? true : null,
            onchange: ev => {
              w.aktiv = ev.target.checked;
              speichern();
              aktualisiereWachsformulare();
            }
          }),
          `${w.marke} · ${w.name} (${w.typ === 'hart' ? 'Hart' : 'Flüssig'})`)
      );
    }
  }
}

// Wenn sich die aktiven Wachse ändern, werden offene Wachs-Auswahlen neu aufgebaut.
function aktualisiereWachsformulare() {
  for (const d of DISZIPLINEN) {
    if (UI[d.key] && UI[d.key].art.value === 'wachsen') zeigeArtFelder(d.key);
  }
}

function exportieren() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const link = h('a', { href: url, download: 'stuwax-' + heuteISO() + '.json' });
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function importVonDatei(ev) {
  const datei = ev.target.files && ev.target.files[0];
  if (!datei) return;
  const leser = new FileReader();
  leser.onload = () => {
    try {
      const daten = JSON.parse(leser.result);
      if (!Array.isArray(daten.skis) || !Array.isArray(daten.wachse) || !Array.isArray(daten.eintraege)) {
        throw new Error('Dateiformat passt nicht');
      }
      state = daten;
      speichern();
      alleAktualisieren();
      homeUI.meldung.textContent = 'Import erfolgreich.';
    } catch (err) {
      homeUI.meldung.textContent = 'Import fehlgeschlagen: ' + err.message;
    }
  };
  leser.readAsText(datei);
  ev.target.value = '';
}

function zuruecksetzen() {
  if (!confirm('Alle Ski, Wachse und Einträge durch die Beispieldaten ersetzen?')) return;
  state = kopie(DEMO);
  speichern();
  alleAktualisieren();
  homeUI.meldung.textContent = 'Beispieldaten geladen.';
}

// ============================================================
// 6. Disziplinseiten: Ski-Auswahl, Ready, Eintrag, Zeitstrahl
// ============================================================

function baueDisziplin(d) {
  const sektion = document.getElementById(d.key);
  const ui = {};
  UI[d.key] = ui;

  // Ski-Auswahl
  ui.skiAuswahl = h('select', {
    class: 'feld',
    id: d.key + '-ski',
    onchange: () => {
      aktuellerSki[d.key] = ui.skiAuswahl.value;
      aktualisiere(d.key);
    }
  });
  ui.bereitKnopf = h('button', { class: 'knopf', type: 'button', onclick: () => toggleBereit(d.key) });
  ui.skiEntfernen = h('button', { class: 'knopf-sekundaer', type: 'button', onclick: () => skiEntfernen(d.key) }, 'Ski entfernen');
  ui.bereitText = h('div', { class: 'hinweis' });
  ui.skiMeldung = h('div', { class: 'hinweis' });

  // Neuer Ski
  ui.neuName = h('input', { class: 'feld', type: 'text', placeholder: 'Name, z. B. Ski E', maxlength: '40' });
  ui.neuLaenge = h('input', { class: 'feld', type: 'number', placeholder: 'Länge in cm', min: '100', max: '230', step: '1' });

  // Eintrag erfassen
  ui.datum = h('input', { class: 'feld', type: 'date', value: heuteISO() });
  ui.art = h('select', { class: 'feld', onchange: () => zeigeArtFelder(d.key) },
    Object.entries(ARTEN).map(([id, name]) => h('option', { value: id }, name)));
  ui.artFelder = h('div');
  ui.bewertung = h('select', { class: 'feld' },
    [1, 2, 3, 4, 5].map(n => h('option', { value: String(n), selected: n === 3 ? true : null }, String(n))));
  ui.notiz = h('input', { class: 'feld', type: 'text', maxlength: '120', placeholder: 'Notiz, optional' });
  ui.eintragMeldung = h('div', { class: 'hinweis' });
  ui.speichern = h('button', { class: 'knopf', type: 'button', onclick: () => eintragSpeichern(d.key) }, 'Eintrag speichern');

  // Zeitstrahl und Detail
  ui.zeitstrahl = h('div');
  ui.detail = h('div', { class: 'detail' }, 'Auf einen Punkt tippen für Details.');

  sektion.innerHTML = '';
  sektion.append(
    h('h1', {}, d.titel),
    h('p', { class: 'beschreibung' }, d.text),

    h('div', { class: 'panel' },
      h('h2', {}, 'Zeitstrahl'),
      h('div', { class: 'legende' }, '● Wachsen   ■ Kanten   ▲ Skifahren   Farbe = Bewertung'),
      h('div', { class: 'hinweis' }, 'Auf einen Punkt tippen für Details, auf die Linie für den ganzen Verlauf.'),
      ui.zeitstrahl,
      ui.detail
    ),

    h('div', { class: 'panel' },
      h('h2', {}, 'Ski'),
      h('label', { class: 'lbl', for: d.key + '-ski' }, 'Ski auswählen'),
      ui.skiAuswahl,
      h('div', { class: 'zeile' }, ui.bereitKnopf, ui.skiEntfernen),
      ui.bereitText,
      ui.skiMeldung,
      h('hr', { class: 'trenner' }),
      h('label', { class: 'lbl' }, 'Neuer Ski'),
      ui.neuName,
      ui.neuLaenge,
      h('div', { class: 'zeile' },
        h('button', { class: 'knopf-sekundaer', type: 'button', onclick: () => skiHinzufuegen(d.key) }, 'Ski hinzufügen'))
    ),

    h('div', { class: 'panel' },
      h('h2', {}, 'Eintrag erfassen'),
      h('label', { class: 'lbl' }, 'Tag'),
      ui.datum,
      h('label', { class: 'lbl' }, 'Art'),
      ui.art,
      ui.artFelder,
      h('label', { class: 'lbl' }, 'Bewertung (1 schwach bis 5 gut)'),
      ui.bewertung,
      h('label', { class: 'lbl' }, 'Notiz'),
      ui.notiz,
      h('div', { class: 'zeile' }, ui.speichern),
      ui.eintragMeldung
    )
  );

  zeigeArtFelder(d.key);
}

// Die Felder unter „Art“ hängen von der gewählten Art ab.
function zeigeArtFelder(key) {
  const ui = UI[key];
  const art = ui.art.value;
  ui.artFelder.innerHTML = '';

  if (art === 'wachsen') {
    const aktive = aktiveWachse();
    // Zwei Spalten: Rennwachs und Basewachs. Eine leere Auswahl heisst: nichts gewählt.
    const optionen = kategorie => [
      h('option', { value: '' }, '—'),
      ...aktive.filter(w => w.kategorie === kategorie)
        .map(w => h('option', { value: w.id }, `${w.marke} · ${w.name} (${w.typ === 'hart' ? 'Hart' : 'Flüssig'})`))
    ];
    const hatBase = aktive.some(w => w.kategorie === 'basewachs');
    ui.artFelder.append(
      h('div', { class: 'zeile' },
        h('div', {},
          h('label', { class: 'lbl' }, 'Rennwachs'),
          h('select', { class: 'feld', 'data-feld': 'wachs-rennen' }, optionen('rennwachs'))),
        h('div', {},
          h('label', { class: 'lbl' }, 'Basewachs'),
          h('select', { class: 'feld', 'data-feld': 'wachs-base' }, optionen('basewachs')))),
      hatBase ? null : h('div', { class: 'hinweis' }, 'Basewachse sind noch nicht erfasst.')
    );
  } else if (art === 'kanten') {
    ui.artFelder.append(
      h('label', { class: 'lbl' }, 'Kanten'),
      h('select', { class: 'feld', 'data-feld': 'kanten' },
        Object.entries(KANTEN_OPTIONEN).map(([id, name]) => h('option', { value: id }, name)))
    );
  } else {
    ui.artFelder.append(
      h('label', { class: 'lbl' }, 'Gefahrene Fahrten (mehrere möglich)'),
      h('div', { class: 'checkgruppe' },
        FAHRTARTEN.map(f => h('label', { class: 'check' },
          h('input', { type: 'checkbox', value: f.id, 'data-feld': 'fahrt' }),
          f.name))),
      h('label', { class: 'lbl' }, 'Anzahl Abfahrten'),
      h('input', { class: 'feld', type: 'number', min: '0', step: '1', value: '0', 'data-feld': 'abfahrten' })
    );
  }
}

// Stellt die Auswahl, die Knöpfe und den Zeitstrahl einer Disziplin auf den aktuellen Stand.
function aktualisiere(key) {
  const ui = UI[key];
  if (!ui) return;
  const liste = skisDerDisziplin(key);
  const aktiv = aktiverSki(key);

  ui.skiAuswahl.innerHTML = '';
  if (!liste.length) ui.skiAuswahl.append(h('option', { value: '' }, 'Noch kein Ski'));
  for (const s of liste) {
    ui.skiAuswahl.append(h('option', { value: s.id }, s.name + (s.laenge ? ' · ' + s.laenge + ' cm' : '')));
  }
  ui.skiAuswahl.value = aktiv ? aktiv.id : '';

  const hatSki = Boolean(aktiv);
  ui.bereitKnopf.disabled = !hatSki;
  ui.skiEntfernen.disabled = !hatSki;
  ui.speichern.disabled = !hatSki;

  if (aktiv) {
    ui.bereitKnopf.textContent = aktiv.bereitSeit ? 'Ready zurücknehmen' : 'Ski ready';
    ui.bereitKnopf.className = aktiv.bereitSeit ? 'knopf-sekundaer' : 'knopf';
    ui.bereitText.textContent = aktiv.bereitSeit ? 'Bereit seit ' + datumDE(aktiv.bereitSeit) : 'Nicht bereit';
  } else {
    ui.bereitKnopf.textContent = 'Ski ready';
    ui.bereitKnopf.className = 'knopf';
    ui.bereitText.textContent = 'Lege zuerst einen Ski an.';
  }

  zeichneZeitstrahl(key, liste, aktiv);
}

function alleAktualisieren() {
  for (const d of DISZIPLINEN) aktualisiere(d.key);
  baueWachsListe();
}

// ============================================================
// 7. Aktionen: Ski, Ready, Einträge
// ============================================================

function skiHinzufuegen(key) {
  const ui = UI[key];
  const name = ui.neuName.value.trim();
  if (!name) {
    ui.skiMeldung.textContent = 'Bitte einen Namen eingeben.';
    return;
  }
  const laenge = Number(ui.neuLaenge.value) || null;
  const ski = { id: neueId(), name, laenge, disziplin: key, bereitSeit: null };
  state.skis.push(ski);
  aktuellerSki[key] = ski.id;
  ui.neuName.value = '';
  ui.neuLaenge.value = '';
  speichern();
  aktualisiere(key);
  ui.skiMeldung.textContent = name + ' angelegt.';
}

function skiEntfernen(key) {
  const ski = aktiverSki(key);
  if (!ski) return;
  if (!confirm(ski.name + ' und alle zugehörigen Einträge löschen?')) return;
  state.skis = state.skis.filter(s => s.id !== ski.id);
  state.eintraege = state.eintraege.filter(e => e.ski !== ski.id);
  aktuellerSki[key] = null;
  speichern();
  aktualisiere(key);
  UI[key].skiMeldung.textContent = ski.name + ' entfernt.';
}

// Ready-Knopf: setzt den Ski auf bereit (mit heutigem Datum) oder nimmt es zurück.
// Der Status bleibt, bis er von Hand geändert wird.
function toggleBereit(key) {
  const ski = aktiverSki(key);
  if (!ski) return;
  ski.bereitSeit = ski.bereitSeit ? null : heuteISO();
  speichern();
  aktualisiere(key);
}

function eintragSpeichern(key) {
  const ui = UI[key];
  const ski = aktiverSki(key);
  if (!ski) return;

  const eintrag = {
    id: neueId(),
    ski: ski.id,
    datum: ui.datum.value,
    art: ui.art.value,
    bewertung: Number(ui.bewertung.value),
    notiz: ui.notiz.value.trim()
  };

  if (!eintrag.datum) {
    ui.eintragMeldung.textContent = 'Bitte ein Datum wählen.';
    return;
  }

  if (eintrag.art === 'wachsen') {
    const wachsId = ui.artFelder.querySelector('[data-feld="wachs-rennen"]').value
      || ui.artFelder.querySelector('[data-feld="wachs-base"]').value;
    if (!wachsById(wachsId)) {
      ui.eintragMeldung.textContent = 'Bitte zuerst ein aktives Wachs auswählen.';
      return;
    }
    eintrag.wachsId = wachsId;
  } else if (eintrag.art === 'kanten') {
    eintrag.kanten = ui.artFelder.querySelector('[data-feld="kanten"]').value;
  } else {
    const arten = [...ui.artFelder.querySelectorAll('[data-feld="fahrt"]:checked')].map(c => c.value);
    const abfahrten = Math.max(0, Math.round(Number(ui.artFelder.querySelector('[data-feld="abfahrten"]').value) || 0));
    eintrag.fahrten = { arten, abfahrten };
  }

  state.eintraege.push(eintrag);
  speichern();
  ui.notiz.value = '';
  aktualisiere(key);
  ui.eintragMeldung.textContent = 'Gespeichert.';
}

function eintragLoeschen(key, e) {
  if (!confirm('Diesen Eintrag löschen?')) return;
  state.eintraege = state.eintraege.filter(x => x.id !== e.id);
  speichern();
  aktualisiere(key);
  UI[key].detail.textContent = 'Eintrag gelöscht.';
}

// ============================================================
// 8. Zeitstrahl
// ============================================================

// Zeichnet je Ski eine Zeile auf einer gemeinsamen Datumsachse.
// Form = Art (Kreis Wachsen, Quadrat Kanten, Dreieck Skifahren), Farbe = Bewertung.
function zeichneZeitstrahl(key, liste, aktiv) {
  const box = UI[key].zeitstrahl;
  box.innerHTML = '';
  if (!liste.length) {
    box.append(h('p', { class: 'leer' }, 'Noch keine Ski in dieser Disziplin.'));
    return;
  }

  const ids = liste.map(s => s.id);
  const eintraege = state.eintraege.filter(e => ids.includes(e.ski));
  const jetzt = zeitpunkt(heuteISO());
  const zeiten = eintraege.length
    ? eintraege.map(e => zeitpunkt(e.datum))
    : [jetzt - 30 * TAG, jetzt + 30 * TAG];
  const min = Math.min(...zeiten) - 7 * TAG;
  const max = Math.max(...zeiten) + 7 * TAG;
  const x = t => PAD + ((t - min) / (max - min)) * (W - 2 * PAD);

  // Monatsmarken
  const monate = [];
  const m = new Date(min);
  m.setDate(1);
  m.setHours(12, 0, 0, 0);
  if (m.getTime() < min) m.setMonth(m.getMonth() + 1);
  while (m.getTime() <= max) {
    monate.push(new Date(m.getTime()));
    m.setMonth(m.getMonth() + 1);
  }

  for (const ski of liste) {
    const eigene = eintraege
      .filter(e => e.ski === ski.id)
      .sort((a, b) => a.datum.localeCompare(b.datum));
    const istAktiv = Boolean(aktiv) && ski.id === aktiv.id;

    const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Zeitstrahl ' + ski.name });
    const kopf = h('div', {
      class: 'ski-kopf',
      onclick: () => {
        aktuellerSki[key] = ski.id;
        aktualisiere(key);
      }
    },
      h('span', { class: 'ski-name' }, ski.name),
      h('span', { class: 'ski-meta' },
        ski.bereitSeit ? h('span', { class: 'ski-bereit' }, 'READY · ') : null,
        eigene.length + ' Einträge' + (ski.laenge ? ' · ' + ski.laenge + ' cm' : '')));
    box.append(h('div', { class: 'ski' + (ski.bereitSeit ? ' bereit' : '') + (istAktiv ? ' aktiv' : '') }, kopf, svg));

    // Tippen auf den Zeitstrahl zeigt den ganzen Verlauf dieses Skis
    svg.style.cursor = 'pointer';
    svg.addEventListener('click', () => zeigeVerlauf(key, ski, eigene));

    svgEl('line', { x1: PAD, x2: W - PAD, y1: BASE_Y, y2: BASE_Y, class: 'baseline' }, svg);
    for (const d of monate) {
      const tx = x(d.getTime());
      svgEl('line', { x1: tx, x2: tx, y1: BASE_Y, y2: BASE_Y + 5, class: 'tick' }, svg);
      const beschriftung = svgEl('text', { x: tx, y: BASE_Y + 18, 'text-anchor': 'middle', class: 'axis-label' }, svg);
      beschriftung.textContent = MONATE[d.getMonth()];
    }
    if (!eigene.length) {
      const leer = svgEl('text', { x: W / 2, y: 20, 'text-anchor': 'middle', class: 'axis-label' }, svg);
      leer.textContent = 'Noch keine Einträge';
    }

    // Mehrere Einträge am selben Tag werden übereinander gestapelt
    const gezaehlt = {};
    for (const e of eigene) {
      const cx = x(zeitpunkt(e.datum));
      gezaehlt[e.datum] = (gezaehlt[e.datum] || 0) + 1;
      const cy = BASE_Y - 8 - (gezaehlt[e.datum] - 1) * 14;
      const bewertung = Math.min(Math.max(Number(e.bewertung) || 3, 1), 5);

      let punkt;
      if (e.art === 'kanten') {
        punkt = svgEl('rect', { x: cx - 6, y: cy - 6, width: 12, height: 12 }, svg);
      } else if (e.art === 'skifahren') {
        punkt = svgEl('path', { d: `M${cx} ${cy - 8} L${cx + 8} ${cy + 6} L${cx - 8} ${cy + 6} Z` }, svg);
      } else {
        punkt = svgEl('circle', { cx: cx, cy: cy, r: 7 }, svg);
      }
      punkt.setAttribute('class', 'dot');
      punkt.setAttribute('fill', FARBEN[bewertung - 1]);
      punkt.setAttribute('tabindex', '0');
      const oeffnen = ev => {
        ev.stopPropagation(); // nicht zusätzlich den ganzen Verlauf öffnen
        zeigeDetail(key, ski, e, punkt);
      };
      punkt.addEventListener('click', oeffnen);
      punkt.addEventListener('keydown', ev => { if (ev.key === 'Enter') oeffnen(ev); });
    }
  }
}

// Kurztext zu einem Eintrag: Wachs, Kanten oder Fahrten
function eintragKurz(e) {
  if (e.art === 'wachsen') {
    const w = wachsById(e.wachsId);
    return w ? `${w.marke} · ${w.name} (${w.typ === 'hart' ? 'Hart' : 'Flüssig'})` : 'gelöschtes Wachs';
  }
  if (e.art === 'kanten') return KANTEN_OPTIONEN[e.kanten] || '–';
  const namen = ((e.fahrten && e.fahrten.arten) || [])
    .map(id => (FAHRTARTEN.find(f => f.id === id) || {}).name)
    .filter(Boolean);
  return (namen.length ? namen.join(', ') : '–') + ' · ' + ((e.fahrten && e.fahrten.abfahrten) || 0) + ' Abfahrten';
}

// Listet alle Einträge eines Skis, neueste zuerst.
function zeigeVerlauf(key, ski, eigene) {
  document.querySelectorAll('.dot.aktiv-punkt').forEach(n => n.classList.remove('aktiv-punkt'));
  const box = UI[key].detail;
  box.innerHTML = '';
  box.append(h('div', { style: 'font-weight:600' }, `${ski.name} · Verlauf (${eigene.length} Einträge)`));
  if (!eigene.length) {
    box.append(h('div', { class: 'leer' }, 'Noch keine Einträge.'));
    return;
  }
  for (const e of [...eigene].reverse()) {
    box.append(h('div', { style: 'margin-top:10px; padding-top:8px; border-top:1px solid var(--line)' },
      h('div', {}, h('span', { class: 'k' }, datumDE(e.datum) + ' · ' + ARTEN[e.art] + ' · '), `Bewertung ${e.bewertung}/5`),
      h('div', {}, eintragKurz(e)),
      e.notiz ? h('div', { class: 'k' }, e.notiz) : null
    ));
  }
}

// Formular zum Ändern eines Eintrags. Die Art (Wachsen, Kanten, Skifahren) bleibt gleich.
function bearbeiteEintrag(key, ski, e) {
  const box = UI[key].detail;
  box.innerHTML = '';
  const datum = h('input', { class: 'feld', type: 'date', value: e.datum });
  const bewertung = h('select', { class: 'feld' },
    [1, 2, 3, 4, 5].map(n => h('option', { value: String(n), selected: n === e.bewertung ? true : null }, String(n))));
  const notiz = h('input', { class: 'feld', type: 'text', maxlength: '120', value: e.notiz || '' });

  let artFeld;
  if (e.art === 'wachsen') {
    artFeld = h('select', { class: 'feld' },
      state.wachse.filter(w => w.aktiv || w.id === e.wachsId).map(w =>
        h('option', { value: w.id, selected: w.id === e.wachsId ? true : null }, `${w.marke} · ${w.name} (${w.typ === 'hart' ? 'Hart' : 'Flüssig'})`)));
  } else if (e.art === 'kanten') {
    artFeld = h('select', { class: 'feld' },
      Object.entries(KANTEN_OPTIONEN).map(([id, name]) =>
        h('option', { value: id, selected: id === e.kanten ? true : null }, name)));
  } else {
    const gewaehlt = (e.fahrten && e.fahrten.arten) || [];
    artFeld = h('div', {},
      h('div', { class: 'checkgruppe' },
        FAHRTARTEN.map(f => h('label', { class: 'check' },
          h('input', { type: 'checkbox', value: f.id, checked: gewaehlt.includes(f.id) ? true : null, 'data-fahrt': '1' }),
          f.name))),
      h('label', { class: 'lbl' }, 'Anzahl Abfahrten'),
      h('input', { class: 'feld', type: 'number', min: '0', step: '1', value: String((e.fahrten && e.fahrten.abfahrten) || 0), 'data-abf': '1' }));
  }

  box.append(
    h('div', { style: 'font-weight:600' }, `${ski.name} · ${ARTEN[e.art]} bearbeiten`),
    h('label', { class: 'lbl' }, 'Tag'), datum,
    h('label', { class: 'lbl' }, e.art === 'wachsen' ? 'Wachs' : e.art === 'kanten' ? 'Kanten' : 'Fahrten'), artFeld,
    h('label', { class: 'lbl' }, 'Bewertung (1 schwach bis 5 gut)'), bewertung,
    h('label', { class: 'lbl' }, 'Notiz'), notiz,
    h('div', { class: 'zeile' },
      h('button', {
        class: 'knopf', type: 'button',
        onclick: () => {
          e.datum = datum.value || e.datum;
          e.bewertung = Number(bewertung.value);
          e.notiz = notiz.value.trim();
          if (e.art === 'wachsen') {
            e.wachsId = artFeld.value;
          } else if (e.art === 'kanten') {
            e.kanten = artFeld.value;
          } else {
            e.fahrten = {
              arten: [...artFeld.querySelectorAll('[data-fahrt]:checked')].map(c => c.value),
              abfahrten: Math.max(0, Math.round(Number(artFeld.querySelector('[data-abf]').value) || 0))
            };
          }
          speichern();
          aktualisiere(key);
          UI[key].detail.textContent = 'Eintrag geändert.';
        }
      }, 'Speichern'),
      h('button', { class: 'knopf-sekundaer', type: 'button', onclick: () => zeigeDetail(key, ski, e, null) }, 'Abbrechen')));
}

function zeigeDetail(key, ski, e, punkt) {
  document.querySelectorAll('.dot.aktiv-punkt').forEach(n => n.classList.remove('aktiv-punkt'));
  if (punkt) punkt.classList.add('aktiv-punkt');

  const box = UI[key].detail;
  box.innerHTML = '';

  const zeilen = [];
  if (e.art === 'wachsen') {
    const w = wachsById(e.wachsId);
    zeilen.push(['Wachs', w ? `${w.marke} · ${w.name} (${w.typ === 'hart' ? 'Hart' : 'Flüssig'})` : 'gelöschtes Wachs']);
  } else if (e.art === 'kanten') {
    zeilen.push(['Kanten', KANTEN_OPTIONEN[e.kanten] || '–']);
  } else {
    const namen = ((e.fahrten && e.fahrten.arten) || [])
      .map(id => (FAHRTARTEN.find(f => f.id === id) || {}).name)
      .filter(Boolean);
    zeilen.push(['Fahrten', namen.length ? namen.join(', ') : '–']);
    zeilen.push(['Abfahrten', String((e.fahrten && e.fahrten.abfahrten) || 0)]);
  }
  zeilen.push(['Bewertung', e.bewertung + ' / 5']);
  if (e.notiz) zeilen.push(['Notiz', e.notiz]);

  box.append(h('div', { style: 'font-weight:600' }, `${ski.name} · ${datumDE(e.datum)} · ${ARTEN[e.art]}`));
  for (const [k, v] of zeilen) {
    box.append(h('div', {}, h('span', { class: 'k' }, k + ': '), v));
  }
  box.append(h('div', { class: 'zeile' },
    h('button', { class: 'knopf', type: 'button', onclick: () => bearbeiteEintrag(key, ski, e) }, 'Bearbeiten'),
    h('button', { class: 'knopf-sekundaer', type: 'button', onclick: () => eintragLoeschen(key, e) }, 'Eintrag löschen')));
}

// ============================================================
// 9. Start und Routing
// ============================================================

const ROUTEN = ['home', ...DISZIPLINEN.map(d => d.key)];

function route() {
  let name = location.hash.replace(/^#\/?/, '') || 'home';
  if (!ROUTEN.includes(name)) name = 'home';
  document.querySelectorAll('main > section').forEach(s => s.classList.toggle('aktiv', s.id === name));
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('aktiv', a.dataset.route === name));
  if (name !== 'home') aktualisiere(name);
  window.scrollTo(0, 0);
}

baueHome();
for (const d of DISZIPLINEN) baueDisziplin(d);
alleAktualisieren();
window.addEventListener('hashchange', route);
route();
</script>
